                                <button
                                  type="button"
                                  onClick={() => setDropDate(getTodayString())}

                              </div>

                                  <span className={`text-xs font-extrabold whitespace-nowrap ${currentInputPrice > 0 ? 'text-amber-500' : (isDark ? 'text-slate-500' : 'text-slate-400')}`}>
                                    {currentInputPrice > 0 ? `= ${formatMeso(currentInputPrice)}` : '0 메소'}
                                  </span>
                                </div>
                                <input
                                  type="text"
                                  inputMode="numeric"
                                  pattern="[0-9,]*"
                                  placeholder="판매 금액을 직접 입력하거나 아래 버튼을 누르세요"
                                  value={dropItemPriceRaw}
                                  onChange={e => {
                                    const clean = e.target.value.replace(/[^0-9]/g, '');
                                    if (!clean) {
                                      setDropItemPriceRaw('');
                                    } else {
                                      setDropItemPriceRaw(parseInt(clean, 10).toLocaleString());
                                    }
                                  }}
                                  className={`w-full border rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-amber-500 text-right font-mono text-sm ${themeInnerInput}`}
                                />
                              </div>

                              <div className="space-y-1.5 pt-1">
                                <div className="text-[11px] text-slate-400 px-1 font-medium">빠른 금액 누적 추가</div>
                                <div className="grid grid-cols-3 sm:flex sm:flex-wrap gap-1.5">
                                  <button type="button" onClick={() => addQuickAmount(1000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-slate-900 text-slate-300 border-slate-700' : 'bg-white border-slate-300 text-slate-700'}`}>+100만</button>
                                  <button type="button" onClick={() => addQuickAmount(5000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-slate-900 text-slate-300 border-slate-700' : 'bg-white border-slate-300 text-slate-700'}`}>+500만</button>
                                  <button type="button" onClick={() => addQuickAmount(10000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-white border-slate-300 text-slate-700'}`}>+1천만</button>

                                  <button type="button" onClick={() => addQuickAmount(50000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-white border-slate-300 text-slate-700'}`}>+5천만</button>
                                  <button type="button" onClick={() => addQuickAmount(100000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-amber-950/60 text-amber-300 border-amber-800/40' : 'bg-amber-50 text-amber-800 border-amber-300'}`}>+1억</button>
                                  <button type="button" onClick={() => addQuickAmount(500000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-amber-950/60 text-amber-300 border-amber-800/40' : 'bg-amber-50 text-amber-800 border-amber-300'}`}>+5억</button>

                                  <button type="button" onClick={() => addQuickAmount(1000000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-amber-950/60 text-amber-300 border-amber-800/40' : 'bg-amber-50 text-amber-800 border-amber-300'}`}>+10억</button>
                                  <button type="button" onClick={() => addQuickAmount(5000000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-amber-950/60 text-amber-300 border-amber-800/40' : 'bg-amber-50 text-amber-800 border-amber-300'}`}>+50억</button>
                                  <button type="button" onClick={() => addQuickAmount(10000000000)} className={`text-xs py-2 sm:px-2.5 sm:py-1 rounded-lg text-center whitespace-nowrap active:scale-95 transition-all border ${isDark ? 'bg-amber-950/60 text-amber-300 border-amber-800/40' : 'bg-amber-50 text-amber-800 border-amber-300'}`}>+100억</button>
                                </div>
                              </div>

                              {currentInputPrice > 0 && (
                                <div className="flex justify-end pt-1">
                                  <button
                                    type="button"
                                    onClick={() => setDropItemPriceRaw('')}
                                    className={`text-xs px-3 py-1 rounded-lg font-bold border transition-colors whitespace-nowrap ${
                                      isDark ? 'bg-rose-950/60 border-rose-900/80 text-rose-300' : 'bg-rose-50 border-rose-200 text-rose-700'
                                    }`}
                                  >
                                    금액 비우기
                                  </button>
                                </div>
                              )}
                            </div>

                            <div className={`flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-xl border text-xs ${themeInnerBox}`}>
                              <div className="flex items-center gap-1.5 shrink-0">
                                <span className={`text-xs whitespace-nowrap ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>수수료:</span>
                                <select
                                  value={dropTaxRate}
                                  onChange={e => setDropTaxRate(Number(e.target.value))}
                                  className={`border text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-amber-500 ${
                                    isDark ? 'bg-slate-900 border-slate-700 text-slate-200' : 'bg-white border-slate-300 text-slate-800'
                                  }`}
                                >
                                  <option value={3}>3% (MVP/PC)</option>
                                  <option value={5}>5% (일반)</option>
                                </select>
                              </div>

                              <div className="flex items-center gap-1.5 shrink-0">
                                <span className="text-xs font-semibold text-amber-500 whitespace-nowrap">분배:</span>
                                <select
                                  value={dropPartyCount}
                                  onChange={e => setDropPartyCount(Number(e.target.value))}
                                  className={`border text-xs font-bold rounded-lg px-2 py-1.5 focus:outline-none focus:border-amber-500 ${
                                    isDark ? 'bg-slate-900 border-amber-600/50 text-white' : 'bg-white border-amber-400 text-slate-800'
                                  }`}
                                >
                                  <option value={1}>1인</option>
                                  <option value={2}>2인</option>
                                  <option value={3}>3인</option>
                                  <option value={4}>4인</option>
                                  <option value={5}>5인</option>
                                  <option value={6}>6인</option>
                                </select>
                              </div>

                              <button
                                type="submit"
                                className="bg-amber-600 hover:bg-amber-500 px-4 py-1.5 rounded-lg font-bold text-white transition-colors shadow-sm shrink-0 ml-auto whitespace-nowrap"
                              >
                                등록
                              </button>
                            </div>

                            {currentInputPrice > 0 && (
                              <div className={`text-xs border px-3.5 py-2 rounded-xl flex justify-between items-center ${
                                isDark ? 'text-amber-300 bg-amber-950/20 border-amber-900/30' : 'text-amber-900 bg-amber-50 border-amber-200'
                              }`}>
                                <span className="whitespace-nowrap">내 몫 (실 수령액):</span>
                                <span className="font-bold text-base text-amber-500 whitespace-nowrap">{formatMeso(previewMyShare)}</span>
                              </div>
                            )}
                          </form>

                          <div className={`mt-5 pt-3.5 border-t ${isDark ? 'border-slate-800/80' : 'border-slate-200'}`}>
                            <div className={`text-xs font-bold mb-2.5 ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>
                              전체 통합 득템 내역 ({allDrops.length}건)
                            </div>
                            {allDrops.length > 0 ? (
                              <div className="space-y-2 max-h-60 overflow-y-auto pr-1 no-scrollbar">
                                {allDrops.map(drop => (
                                  <div
                                    key={drop.id}
                                    className={`flex items-center justify-between border px-3.5 py-2.5 rounded-xl text-xs ${themeInnerBox}`}
                                  >
                                    <div>
                                      <div className="flex items-center gap-2 flex-wrap">
                                        <span className={`font-bold ${isDark ? 'text-slate-100' : 'text-slate-900'}`}>{drop.name}</span>
                                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-sky-600 text-white font-bold">
                                          {drop.charName}
                                        </span>
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded ${isDark ? 'bg-slate-800 text-slate-400' : 'bg-slate-200 text-slate-600'}`}>
                                          {drop.date || '날짜 미기재'}
                                        </span>
                                      </div>
                                      <div className={`text-[11px] mt-0.5 ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>

                                      </div>
                                    </div>
                                    <div className="flex items-center gap-2.5 shrink-0">
                                      <span className="text-amber-500 font-bold whitespace-nowrap">{formatMeso(drop.price)}</span>
                                      <button
                                        type="button"
                                        onClick={() => handleDeleteDrop(drop.charId, drop.id)}
                                        className="text-rose-500 hover:text-rose-400 text-xs p-1"
                                      >
                                        ✕
                                      </button>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <div className={`text-center py-6 text-xs border border-dashed rounded-xl ${
                                isDark ? 'text-slate-500 border-slate-800' : 'text-slate-400 border-slate-300'
                              }`}>

                              </div>
                            )}
                          </div>
                        </div>
                      )}

                  )}
                </div>

                  target="_blank"

                </a>
              </div>
            </div>

              <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 p-4" onClick={() => setShowRefreshReport(false)}>
                <div className={`w-full max-w-md rounded-2xl p-5 shadow-2xl border ${isDark ? 'bg-slate-900 text-white border-slate-700' : 'bg-white text-slate-900 border-slate-200'}`} onClick={e => e.stopPropagation()}>
                  <h3 className="font-extrabold text-base mb-3">캐릭터 정보 갱신 결과</h3>
                  <p className="text-sm mb-3">성공 {refreshReport.success}명 · 실패 {refreshReport.failures.length}명 / 총 {refreshReport.total}명</p>
                  {refreshReport.failures.length ? (
                    <div className="max-h-60 overflow-y-auto space-y-2 mb-4">
                      {refreshReport.failures.map(item => (
                        <div key={item.id} className="rounded-lg border border-rose-500/30 p-2 text-xs">
                          <div className="font-bold text-rose-400">{item.name}</div>
                          <div className="mt-1 opacity-80 break-words">{item.reason}</div>
                        </div>
                      ))}
                    </div>
                  ) : <p className="text-xs text-emerald-500 mb-4">모든 캐릭터가 정상 갱신되었습니다.</p>}
                  {ocidCandidates.length > 0 && (
                  <div className="mb-4 space-y-2">
                   <p className="text-xs font-bold text-amber-500">OCID 변경 가능성이 발견되었습니다. 본인 캐릭터인지 확인 후 복구하세요.</p>
                   {ocidCandidates.map(candidate => (
                     <div key={candidate.oldId} className="rounded-lg border border-amber-500/40 p-3 text-xs space-y-1">
                       <div className="font-bold">{candidate.name} · {candidate.job} · Lv.{candidate.level}</div>
                       <div className="break-all opacity-80">기존: {candidate.oldId}</div>
                       <div className="break-all opacity-80">신규: {candidate.newId}</div>
                       <button type="button" disabled={repairingOcid || refreshingCharacters}
                        onClick={() => repairOcid(candidate)}
                        className="mt-2 rounded-lg bg-amber-600 px-3 py-2 font-bold text-white disabled:opacity-50">
                        {repairingOcid ? '복구 중...' : '확인 후 OCID 복구'}
                       </button>
                     </div>
                   ))}
                  </div>
                )}
                <div className="flex justify-end gap-2">
                  {refreshReport.failures.length > 0 && (
                      <button type="button" disabled={refreshingCharacters} onClick={() => { setShowRefreshReport(false); refreshCharacterInfo(true, false); }} className="rounded-lg px-3 py-2 bg-emerald-600 text-white text-xs font-bold disabled:opacity-50">실패 캐릭터 재시도</button>
                    )}
                    <button type="button" onClick={() => setShowRefreshReport(false)} className="rounded-lg px-3 py-2 bg-sky-600 text-white text-xs font-bold">닫기</button>
                  </div>
                </div>
              </div>
            )}
            {alertModalMessage && (
              <div
                onClick={() => setAlertModalMessage('')}
                className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 animate-fadeIn"
              >
                <div
                  onClick={e => e.stopPropagation()}
                  className={`border rounded-2xl p-6 max-w-xs w-full shadow-2xl text-center relative ${themeCard}`}
                >
                  <div className="text-3xl mb-2">⚠️</div>
                  <h3 className={`text-sm font-bold mb-2 ${isDark ? 'text-white' : 'text-slate-900'}`}>알림</h3>
                  <p className={`text-xs mb-5 whitespace-pre-line leading-relaxed ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                    {alertModalMessage}
                  </p>
                  <button
                    type="button"
                    onClick={() => setAlertModalMessage('')}
                    className="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition-colors shadow-sm"
                  >
                    확인
                  </button>
                </div>
              </div>
            )}

            {/* 캐릭터 추가 모달 */}
            {showAddCharModal && (
              <div
                onClick={() => setShowAddCharModal(false)}
                className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50"
              >
                <div
                  onClick={e => e.stopPropagation()}
                  className={`border rounded-2xl p-5 max-w-sm w-full shadow-2xl relative ${themeCard}`}
                >
                  <button
                    type="button"
                    onClick={() => setShowAddCharModal(false)}
                    className={`absolute top-4 right-4 p-1 rounded-lg text-sm leading-none transition-colors ${
                      isDark ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                    title="닫기"
                  >
                    ✕
                  </button>

                  <h3 className={`text-sm font-bold mb-3 pr-6 ${isDark ? 'text-white' : 'text-slate-900'}`}>캐릭터 추가</h3>

                  <div className="flex gap-2 mb-3">
                    <button
                      type="button"
                      onClick={() => { setAddMode('api'); setFormError(''); }}
                      className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                        addMode === 'api'
                          ? 'bg-sky-600 text-white shadow'
                          : (isDark ? 'bg-slate-800/70 text-slate-400' : 'bg-slate-200/80 text-slate-600')
                      }`}
                    >
                      API 자동 조회
                    </button>
                    <button
                      type="button"
                      onClick={() => { setAddMode('manual'); setFormError(''); }}
                      className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                        addMode === 'manual'
                          ? 'bg-sky-600 text-white shadow'
                          : (isDark ? 'bg-slate-800/70 text-slate-400' : 'bg-slate-200/80 text-slate-600')
                      }`}
                    >
                      수동 직접 입력
                    </button>
                  </div>

                  {addMode === 'api' ? (
                    <form onSubmit={handleApiAdd}>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="캐릭터 닉네임 입력"
                          value={searchName}
                          onChange={e => setSearchName(e.target.value)}
                          disabled={isSearching}
                          className={`border rounded-xl px-3.5 py-2 text-xs flex-1 focus:outline-none focus:border-sky-500 ${themeInnerInput}`}
                        />
                        <button
                          type="submit"
                          disabled={isSearching}
                          className="bg-sky-600 hover:bg-sky-500 disabled:bg-slate-400 px-4 py-2 rounded-xl text-xs font-bold text-white transition-colors whitespace-nowrap"
                        >
                          {isSearching ? '조회중...' : '추가'}
                        </button>
                      </div>
                    </form>
                  ) : (
                    <form onSubmit={handleManualAdd} className="space-y-2">
                      <div className="grid grid-cols-12 gap-2">
                        <input
                          type="text"
                          placeholder="닉네임"
                          value={manualName}
                          onChange={e => setManualName(e.target.value)}
                          className={`col-span-5 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500 ${themeInnerInput}`}
                        />
                        <input
                          type="text"
                          placeholder="직업"
                          value={manualJob}
                          onChange={e => setManualJob(e.target.value)}
                          className={`col-span-4 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500 ${themeInnerInput}`}
                        />
                        <input
                          type="number"
                          placeholder="레벨"
                          value={manualLevel}
                          onChange={e => setManualLevel(e.target.value)}
                          className={`col-span-3 border rounded-xl px-2 py-2 text-xs focus:outline-none focus:border-sky-500 text-center ${themeInnerInput}`}
                        />
                      </div>
                      <button
                        type="submit"
                        className={`w-full py-2 rounded-xl text-xs font-bold border transition-colors ${
                          isDark
                            ? 'bg-slate-800 hover:bg-slate-700 text-sky-400 border-slate-700'
                            : 'bg-slate-100 hover:bg-slate-200 text-sky-600 border-slate-300'
                        }`}
                      >
                        캐릭터 추가 완료
                      </button>
                    </form>
                  )}

                  {formError && <p className="text-[11px] text-rose-500 mt-2 px-1">{formError}</p>}
                </div>
              </div>
            )}

            {/* 계정 연동 모달 */}
            {showSyncModal && (
              <div
                onClick={() => setShowSyncModal(false)}
                className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50"
              >
                <div
                  onClick={e => e.stopPropagation()}
                  className={`border rounded-2xl p-5 max-w-sm w-full shadow-2xl relative ${themeCard}`}
                >
                  <button
                    type="button"
                    onClick={() => setShowSyncModal(false)}
                    className={`absolute top-4 right-4 p-1 rounded-lg text-sm leading-none transition-colors ${
                      isDark ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                    title="닫기"
                  >
                    ✕
                  </button>

                  <h3 className={`text-sm font-bold mb-1 pr-6 ${isDark ? 'text-white' : 'text-slate-900'}`}>클라우드 계정 연동</h3>
                  <p className={`text-[11px] mb-3 leading-relaxed ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                    기기 간 데이터 연동 및 주차별 보스 수익 비교를 위한 계정 관리 메뉴입니다.
                  </p>

                  <div className={`grid grid-cols-3 gap-1 p-1 rounded-xl border mb-3 ${themeInnerBox}`}>
                    <button
                      type="button"
                      onClick={() => setSyncMode('register')}
                      className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${
                        syncMode === 'register'
                          ? 'bg-sky-600 text-white shadow'
                          : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                      }`}
                    >
                      계정 만들기
                    </button>
                    <button
                      type="button"
                      onClick={() => setSyncMode('login')}
                      className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${
                        syncMode === 'login'
                          ? 'bg-sky-600 text-white shadow'
                          : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                      }`}
                    >
                      로그인
                    </button>
                    <button
                      type="button"
                      onClick={() => setSyncMode('delete')}
                      className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${
                        syncMode === 'delete'
                          ? 'bg-rose-600 text-white shadow'
                          : (isDark ? 'text-rose-400 hover:text-rose-200' : 'text-rose-500 hover:text-rose-800')
                      }`}
                    >
                      계정 삭제
                    </button>
                  </div>

                  <div className="space-y-2 mb-4">
                    <div>
                      <label className={`block text-[10px] font-bold mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>동기화 ID</label>
                      <input
                        type="text"
                        placeholder="동기화 ID 입력"
                        value={tempSyncId}
                        onChange={e => setTempSyncId(e.target.value)}
                        className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                          syncMode === 'delete' ? 'focus:border-rose-500' : 'focus:border-sky-500'
                        } ${themeInnerInput}`}
                      />
                    </div>
                    <div>
                      <label className={`block text-[10px] font-bold mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>비밀번호 (PIN)</label>
                      <input
                        type="password"
                        placeholder="비밀번호 입력"
                        value={tempSyncPassword}
                        onChange={e => setTempSyncPassword(e.target.value)}
                        onKeyDown={e => {
                          if (e.key === 'Enter') {
                            handleSyncSubmit();
                          }
                        }}
                        className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                          syncMode === 'delete' ? 'focus:border-rose-500' : 'focus:border-sky-500'
                        } ${themeInnerInput}`}
                      />
                    </div>
                  </div>

                  {syncMode === 'delete' && (
                    <div className="mb-4 p-2.5 rounded-xl bg-rose-950/30 border border-rose-900/50 text-[11px] text-rose-400 leading-relaxed">
                      ⚠️ 계정을 삭제하면 클라우드에 저장된 모든 캐릭터, 보스 체크 데이터 및 주차별 히스토리가 영구히 삭제됩니다.
                    </div>
                  )}

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowSyncModal(false)}
                      className={`px-3 py-2 rounded-xl text-xs font-medium ${
                        isDark ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'
                      }`}
                    >
                      취소
                    </button>

                    {syncId && syncMode !== 'delete' && (
                      <button
                        type="button"
                        onClick={() => {
                          if (confirm('클라우드 연동을 해제하고 로컬 모드로 전환하시겠습니까? (서버 데이터는 유지됩니다)')) {
                            localStorage.removeItem('maple_sync_id');
                            localStorage.removeItem('maple_sync_pw');
                            setSyncId('');
                            setSyncPassword('');
                            setSyncStatus('로컬 모드 (저장됨)');
                            setShowSyncModal(false);
                          }
                        }}
                        className={`py-2 px-3 rounded-xl text-xs font-medium whitespace-nowrap ${
                          isDark ? 'bg-slate-800 text-rose-400 hover:bg-slate-700' : 'bg-slate-200 text-rose-600 hover:bg-slate-300'
                        }`}
                      >
                        연동 해제
                      </button>
                    )}

                    <button
                      type="button"
                      onClick={handleSyncSubmit}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold text-white transition-colors whitespace-nowrap ${
                        syncMode === 'delete'
                          ? 'bg-rose-600 hover:bg-rose-500'
                          : 'bg-sky-600 hover:bg-sky-500'
                      }`}
                    >
                      {syncMode === 'register' ? '계정 생성 및 연동' : syncMode === 'login' ? '로그인 및 불러오기' : '영구 삭제'}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
