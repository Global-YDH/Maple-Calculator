<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>메이플 보스 수익 계산기</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input, select, button { -webkit-user-select: auto; user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // GitHub Pages 운영 사이트에서만 클라우드 동기화를 허용합니다.
    // 사용자 지정 도메인을 사용하는 경우 운영 도메인을 아래 조건에 추가하세요.
    const ENABLE_CLOUD_SYNC = window.location.hostname.endsWith('.github.io');

    const DEFAULT_SB_URL = 'https://pmudomjxhvmnvusfnqhn.supabase.co';

    async function requestSyncApi(action, id, password, data = null) {
      if (!ENABLE_CLOUD_SYNC) throw new Error('로컬 테스트에서는 클라우드 동기화가 비활성화되어 있습니다.');
      const res = await fetch(`${DEFAULT_SB_URL}/functions/v1/sync-account`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, id, password, data })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || '요청 처리에 실패했습니다.');
      return json;
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getCurrentThursdayResetTime() {
      const now = new Date();
      const day = now.getDay();
      let diff = day - 4;
      if (diff < 0) diff += 7;
      const thursday = new Date(now);
      thursday.setDate(now.getDate() - diff);
      thursday.setHours(0, 0, 0, 0);
      return thursday.getTime();
    }

    function getMapleWeekKey(timestamp = Date.now()) {
      const target = new Date(timestamp);
      const day = target.getDay();
      let diff = day - 4;
      if (diff < 0) diff += 7;
      const thursday = new Date(target);
      thursday.setDate(target.getDate() - diff);
      thursday.setHours(0, 0, 0, 0);

      const yearStart = new Date(thursday.getFullYear(), 0, 1);
      const weekNo = Math.ceil((((thursday - yearStart) / 86400000) + 1) / 7);
      return `${thursday.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function formatMeso(meso) {
      if (!meso) return '0 메소';
      const absVal = Math.abs(meso);
      const jo = Math.floor(absVal / 1000000000000);
      const eok = Math.floor((absVal % 1000000000000) / 100000000);
      const man = Math.floor((absVal % 100000000) / 10000);
      const won = Math.floor(absVal % 10000);

      const parts = [];
      if (jo > 0) parts.push(`${jo.toLocaleString()}조`);
      if (eok > 0) parts.push(`${eok.toLocaleString()}억`);
      if (man > 0) parts.push(`${man.toLocaleString()}만`);
      if (won > 0 && jo === 0 && eok === 0) parts.push(`${won.toLocaleString()}`);

      const res = parts.length > 0 ? parts.join(' ') + ' 메소' : `${absVal.toLocaleString()} 메소`;
      return meso < 0 ? `-${res}` : res;
    }

    function parseCSV(text) {
      const cleanText = text.replace(/^\uFEFF/, '').trim();
      const lines = cleanText.split(/\r?\n/);
      if (lines.length < 2) return [];

      const rawHeaders = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, '').toLowerCase());

      return lines.slice(1).map(line => {
        if (!line.trim()) return null;

        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim().replace(/^["']|["']$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim().replace(/^["']|["']$/g, ''));

        const obj = {};
        rawHeaders.forEach((h, i) => {
          if (h) obj[h] = result[i] !== undefined ? result[i] : '';
        });

        const rawPrice = String(obj.price || '0').replace(/[^0-9]/g, '');
        const cycle = (obj.cycle || 'weekly').trim().toLowerCase();

        if (cycle === 'daily') return null;

        return {
          id: obj.id,
          name: obj.name,
          difficulty: obj.difficulty,
          cycle: cycle,
          price: parseInt(rawPrice, 10) || 0
        };
      }).filter(item => item && item.id && item.price > 0);
    }

    function BossImage({ name, isDark }) {
      const [imgFailed, setImgFailed] = useState(false);

      if (imgFailed) {
        return (
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm shrink-0 border ${
            isDark ? 'bg-slate-800 text-sky-400 border-slate-700' : 'bg-sky-100 text-sky-700 border-sky-200'
          }`}>
            {name.slice(0, 1)}
          </div>
        );
      }

      return (
        <img
          src={`./images/${encodeURIComponent(name)}.png`}
          alt=""
          onError={() => setImgFailed(true)}
          className="w-10 h-10 rounded-xl object-contain bg-slate-900/40 border border-slate-700/60 shrink-0 shadow-sm"
        />
      );
    }

    function DiffBadge({ diff }) {
      if (!diff || diff === 0 || isNaN(diff)) return null;
      const isPlus = diff > 0;
      return (
        <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-extrabold shrink-0 whitespace-nowrap inline-flex items-center gap-0.5 ${
          isPlus
            ? 'bg-emerald-950/70 text-emerald-400 border border-emerald-800/60'
            : 'bg-rose-950/70 text-rose-400 border border-rose-800/60'
        }`}>
          <span>{isPlus ? '▲ +' : '▼ -'}</span>
          <span>{formatMeso(Math.abs(diff)).replace(' 메소', '')}</span>
        </span>
      );
    }

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('maple_theme') || 'dark');
      const isDark = theme === 'dark';

      const toggleTheme = () => {
        const next = isDark ? 'light' : 'dark';
        setTheme(next);
        localStorage.setItem('maple_theme', next);
      };

      const [syncId, setSyncId] = useState(() => localStorage.getItem('maple_sync_id') || '');
      const [syncPassword, setSyncPassword] = useState(() => localStorage.getItem('maple_sync_pw') || '');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [showAddCharModal, setShowAddCharModal] = useState(false);

      // 🔥 정중앙 알림 모달 상태 추가
      const [alertModalMessage, setAlertModalMessage] = useState('');

      const [syncMode, setSyncMode] = useState('register');
      const [tempSyncId, setTempSyncId] = useState('');
      const [tempSyncPassword, setTempSyncPassword] = useState('');
      const [syncStatus, setSyncStatus] = useState('로컬 모드 (저장됨)');

      const [mainTab, setMainTab] = useState('weekly');
      const [incomePeriod, setIncomePeriod] = useState('weekly');

      const [isMvpOrPc, setIsMvpOrPc] = useState(() => {
        const saved = localStorage.getItem('maple_is_mvp');
        return saved !== null ? JSON.parse(saved) : true;
      });

      const [bossList, setBossList] = useState([]);
      const [loadingBosses, setLoadingBosses] = useState(true);
      const [loadError, setLoadError] = useState(false);

      const [characters, setCharacters] = useState(() => {
        const saved = localStorage.getItem('maple_characters_v2');
        return saved ? JSON.parse(saved) : [];
      });
      const [activeCharId, setActiveCharId] = useState('');
      const [isReorderingCharacters, setIsReorderingCharacters] = useState(false);
      const [refreshingCharacters, setRefreshingCharacters] = useState(false);
      const [refreshReport, setRefreshReport] = useState(null);
      const [showRefreshReport, setShowRefreshReport] = useState(false);
      const [ocidCandidates, setOcidCandidates] = useState([]);
      const [repairingOcid, setRepairingOcid] = useState(false);
      const saveQueue = useRef(Promise.resolve());
      const [cloudReady, setCloudReady] = useState(false);
      const refreshInProgress = useRef(false);
      const charactersRef = useRef(characters);
      charactersRef.current = characters;


      const [weeklyHistory, setWeeklyHistory] = useState(() => {
        const saved = localStorage.getItem('maple_weekly_history_v2');
        return saved ? JSON.parse(saved) : {};
      });

      const [addMode, setAddMode] = useState('api');
      const [searchName, setSearchName] = useState('');
      const [manualName, setManualName] = useState('');
      const [manualJob, setManualJob] = useState('');
      const [manualLevel, setManualLevel] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [formError, setFormError] = useState('');

      const [dropItemName, setDropItemName] = useState('');
      const [dropItemPriceRaw, setDropItemPriceRaw] = useState('');
      const [dropDate, setDropDate] = useState(getTodayString());
      const [dropTaxRate, setDropTaxRate] = useState(isMvpOrPc ? 3 : 5);
      const [dropPartyCount, setDropPartyCount] = useState(1);

      const currentWeekKey = useMemo(() => getMapleWeekKey(Date.now()), []);
      const lastWeekKey = useMemo(() => getMapleWeekKey(Date.now() - (7 * 24 * 60 * 60 * 1000)), []);

      const handleRegisterAccount = async (targetId, targetPw) => {
        setSyncStatus('계정 생성 중...');
        try {
          const payload = {
            characters,
            isMvpOrPc,
            weeklyHistory,
            updatedAt: new Date().toISOString()
          };
          await requestSyncApi('register', targetId, targetPw, payload);
          setSyncStatus('클라우드 연동됨');
          return true;
        } catch (err) {
          console.error(err);
          setSyncStatus('생성 실패');
          setAlertModalMessage(err.message || '계정 생성 중 오류가 발생했습니다.');
          return false;
        }
      };

      const handleLoginAccount = async (targetId, targetPw) => {
        setSyncStatus('불러오는 중...');
        try {
          const res = await requestSyncApi('login', targetId, targetPw);
          if (res.data) {
            const parsed = res.data;
            if (parsed.characters) setCharacters(parsed.characters);
            if (parsed.weeklyHistory) setWeeklyHistory(parsed.weeklyHistory);
            if (typeof parsed.isMvpOrPc === 'boolean') {
              setIsMvpOrPc(parsed.isMvpOrPc);
              setDropTaxRate(parsed.isMvpOrPc ? 3 : 5);
            }
          }
          setSyncStatus('클라우드 연동됨');
          return true;
        } catch (err) {
          console.error(err);
          setSyncStatus('로그인 실패');
          setAlertModalMessage(err.message || '로그인 중 오류가 발생했습니다.');
          return false;
        }
      };

      const handleSyncSubmit = async () => {
        const idVal = tempSyncId.trim();
        const pwVal = tempSyncPassword.trim();
        if (!idVal || !pwVal) {
          setAlertModalMessage('동기화 ID와 비밀번호를 모두 입력해주세요!');
          return;
        }

        if (syncMode === 'delete') {
          setAlertModalMessage(`[${idVal}] 계정을 클라우드에서 정말 영구히 삭제하시겠습니까?`);
          // 삭제 컨펌은 확인 버튼이 있는 별도 로직이 필요하므로 단순 알림 대신 기존 confirm 유지하거나 모달 확장 가능
          if (!confirm(`[${idVal}] 계정을 클라우드에서 정말 영구히 삭제하시겠습니까?`)) return;

          setSyncStatus('삭제 중...');
          try {
            await requestSyncApi('delete', idVal, pwVal);

            if (syncId === idVal) {
              localStorage.removeItem('maple_sync_id');
              localStorage.removeItem('maple_sync_pw');
              setSyncId('');
              setSyncPassword('');
            }

            setSyncStatus('로컬 모드 (저장됨)');
            setShowSyncModal(false);
            setAlertModalMessage('클라우드 계정이 성공적으로 삭제되었습니다.');
          } catch (err) {
            console.error(err);
            setSyncStatus('삭제 오류');
            setAlertModalMessage(err.message || '계정 삭제 중 오류가 발생했습니다.');
          }
          return;
        }

        let success = false;
        if (syncMode === 'register') {
          success = await handleRegisterAccount(idVal, pwVal);
        } else {
          success = await handleLoginAccount(idVal, pwVal);
        }

        if (success) {
          localStorage.setItem('maple_sync_id', idVal);
          localStorage.setItem('maple_sync_pw', pwVal);
          setSyncId(idVal);
          setSyncPassword(pwVal);
          setShowSyncModal(false);
          setAlertModalMessage(syncMode === 'register' ? '계정이 성공적으로 생성되고 연동되었습니다!' : '기존 계정 데이터를 성공적으로 불러왔습니다!');
        }
      };

      useEffect(() => {
        let cancelled = false;
        (async () => {
          if (ENABLE_CLOUD_SYNC && syncId && syncPassword) await handleLoginAccount(syncId, syncPassword);
          if (!cancelled) setCloudReady(true);
        })();
        return () => { cancelled = true; };
      }, []);

      // 모든 클라우드 저장을 순서대로 실행해 이전 상태가 나중에 덮어쓰지 않도록 합니다.
      const enqueueCloudSave = (payload) => {
        const task = saveQueue.current.catch(() => {}).then(() => requestSyncApi('save', syncId, syncPassword, payload));
        saveQueue.current = task;
        return task;
      };

      const repairOcid = async (candidate) => {
        if (repairingOcid || refreshingCharacters || !cloudReady) return;
        const current = charactersRef.current;
        const target = current.find(c => c.id === candidate.oldId && c.name === candidate.name);
        if (!target || current.some(c => c.id === candidate.newId)) {
          setAlertModalMessage('복구 대상이 변경되었거나 새 OCID가 이미 등록되어 있습니다. 다시 갱신해 주세요.');
          setOcidCandidates(prev => prev.filter(c => c.oldId !== candidate.oldId));
          return;
        }
        if (!window.confirm(`[${candidate.name}]의 OCID를 변경하시겠습니까?\n\n기존: ${candidate.oldId}\n신규: ${candidate.newId}\n\n닉네임이 같더라도 동일 캐릭터라는 보장은 없습니다. 본인 캐릭터인지 확인한 경우에만 승인해 주세요.\n보스 설정, 득템 기록, 주차별 기록은 유지됩니다.`)) return;
        if (syncId && syncPassword && syncStatus !== '클라우드 연동됨') {
          setAlertModalMessage('클라우드 연결 상태가 정상인지 확인한 뒤 다시 시도해 주세요.');
          return;
        }
        setRepairingOcid(true);
        try {
          // 승인 시점에 새 OCID의 최신 데이터를 다시 검증합니다.
          const response = await fetch(`${DEFAULT_SB_URL}/functions/v1/get-character?name=${encodeURIComponent(candidate.name)}`);
          const data = await response.json();
          if (!response.ok || data.ocid !== candidate.newId || data.name !== candidate.name || !data.job || !Number.isFinite(Number(data.level))) {
            throw new Error('최신 캐릭터 정보가 일치하지 않아 복구를 중단했습니다.');
          }
          const updatedCharacters = current.map(char => char.id !== candidate.oldId ? char : {
            ...char, id: candidate.newId, name: data.name, job: data.job,
            level: data.level, image: data.image,
            drops: (char.drops || []).map(drop => ({
             ...drop, charId: drop.charId === candidate.oldId ? candidate.newId : drop.charId
            }))
          });
          const updatedHistory = Object.fromEntries(Object.entries(weeklyHistory).map(([week, entry]) => {
            if (!entry || !entry.chars || !Object.prototype.hasOwnProperty.call(entry.chars, candidate.oldId)) return [week, entry];
            const chars = { ...entry.chars };
            chars[candidate.newId] = chars[candidate.oldId];
            delete chars[candidate.oldId];
            return [week, { ...entry, chars }];
          }));
          if (syncId && syncPassword) {
            setSyncStatus('저장 중...');
            await enqueueCloudSave({ characters: updatedCharacters, isMvpOrPc, weeklyHistory: updatedHistory, updatedAt: new Date().toISOString() });
            setSyncStatus('클라우드 연동됨');
          }
          setCharacters(updatedCharacters);
          setWeeklyHistory(updatedHistory);
          localStorage.setItem('maple_characters_v2', JSON.stringify(updatedCharacters));
          localStorage.setItem('maple_weekly_history_v2', JSON.stringify(updatedHistory));
          setActiveCharId(id => id === candidate.oldId ? candidate.newId : id);
          setOcidCandidates(prev => prev.filter(c => c.oldId !== candidate.oldId));
          setAlertModalMessage(`[${candidate.name}] OCID 복구가 완료되었습니다. 보스 설정과 득템 기록은 유지되었습니다.`);
        } catch (err) {
          setSyncStatus(syncId && syncPassword ? '저장 실패' : syncStatus);
          setAlertModalMessage(`OCID 복구 실패: ${err.message || '알 수 없는 오류'}\n기존 데이터는 변경하지 않았습니다.`);
        } finally { setRepairingOcid(false); }
      };

      const refreshCharacterInfo = async (onlyFailed = false, automatic = false) => {
        if (refreshInProgress.current || !cloudReady) return;
        const all = charactersRef.current;
        const previousFailures = refreshReport?.failures || [];
        const failureIds = new Set(previousFailures.map(item => item.id));
        const targets = all.filter(c => c.id && !String(c.id).startsWith('custom_') && (!onlyFailed || failureIds.has(c.id)));
        if (!targets.length) {
          if (!automatic) setAlertModalMessage(onlyFailed ? '재시도할 캐릭터가 없습니다.' : 'API로 등록된 캐릭터가 없습니다.');
          return;
        }
        refreshInProgress.current = true;
        setRefreshingCharacters(true);
        const failures = [];
        const detectedCandidates = [];
        const updates = new Map();
        let successCount = 0;
        try {
          // 순차 요청으로 API 호출 폭주 방지. 실패해도 나머지 캐릭터 계속 처리.
          for (const char of targets) {
            try {
              const res = await fetch(`${DEFAULT_SB_URL}/functions/v1/get-character?ocid=${encodeURIComponent(char.id)}`);
              let data;
              try { data = await res.json(); } catch (_) { throw new Error(`서버 응답을 해석할 수 없습니다. (HTTP ${res.status})`); }
             if (!res.ok || !data.ocid || data.ocid !== char.id || !data.name) {
               // 정상 캐릭터 데이터가 아닌 경우에만 닉네임으로 OCID 변경 후보를 찾습니다.
               // 네트워크 장애나 인증 오류는 복구 후보로 만들지 않습니다.
               const invalidData = (res.status === 502 && data.code === 'INVALID_CHARACTER_DATA') ||
                 (res.ok && (!data.name || !data.ocid));
               if (invalidData && char.name) {
                 try {
                  const lookupRes = await fetch(`${DEFAULT_SB_URL}/functions/v1/get-character?name=${encodeURIComponent(char.name)}`);
                  const lookup = await lookupRes.json();
                  if (lookupRes.ok && lookup.ocid && lookup.ocid !== char.id && lookup.name === char.name &&
                      lookup.job && Number.isFinite(Number(lookup.level)) &&
                      !all.some(c => c.id === lookup.ocid)) {
                    detectedCandidates.push({ oldId: char.id, newId: lookup.ocid, name: char.name, job: lookup.job, level: lookup.level });
                  }
                 } catch (_) { /* 재조회 실패 시 기존 데이터 유지 */ }
               }
               throw new Error(data.error || `조회 실패 (HTTP ${res.status})`);
             }
              updates.set(char.id, { name: data.name, job: data.job, level: data.level, image: data.image });
              successCount++;
            } catch (err) {
              failures.push({ id: char.id, name: char.name, reason: err.message || '알 수 없는 오류' });
            }
          }
          if (updates.size) {
            setCharacters(prev => prev.map(char => {
              const info = updates.get(char.id);
              return info ? { ...char, ...info } : char; // clears/drops 및 기타 설정 보존
            }));
          }
          setOcidCandidates(prev => {
            const ids = new Set(targets.map(c => c.id));
            return [...prev.filter(c => !ids.has(c.oldId)), ...detectedCandidates];
          });
          const report = { success: successCount, total: targets.length, failures, at: new Date().toISOString() };
          setRefreshReport(report);
          if (failures.length) setShowRefreshReport(true);
          if (!automatic) setShowRefreshReport(true);
        } finally {
          refreshInProgress.current = false;
          setRefreshingCharacters(false);
        }
      };

      useEffect(() => {
        if (!ENABLE_CLOUD_SYNC || !cloudReady) return;
        // 클라우드 로그인/데이터 불러오기가 끝난 뒤, 접속할 때마다 즉시 갱신합니다.
        refreshCharacterInfo(false, true);
      }, [cloudReady]);


      const isInitialMount = useRef(true);
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        localStorage.setItem('maple_characters_v2', JSON.stringify(characters));
        localStorage.setItem('maple_weekly_history_v2', JSON.stringify(weeklyHistory));

        if (!ENABLE_CLOUD_SYNC || !syncId || !syncPassword || !cloudReady) return;

        const timer = setTimeout(async () => {
          setSyncStatus('저장 중...');
          try {
            const payload = {
              characters,
              isMvpOrPc,
              weeklyHistory,
              updatedAt: new Date().toISOString()
            };
            await enqueueCloudSave(payload);
            setSyncStatus('클라우드 연동됨');
          } catch (err) {
            console.error(err);
            setSyncStatus('저장 실패');
          }
        }, 1000);

        return () => clearTimeout(timer);
      }, [characters, isMvpOrPc, weeklyHistory, cloudReady]);

      const toggleMvpBenefit = (checked) => {
        setIsMvpOrPc(checked);
        localStorage.setItem('maple_is_mvp', JSON.stringify(checked));
        setDropTaxRate(checked ? 3 : 5);
      };

      const addQuickAmount = (amount) => {
        const current = parseInt(dropItemPriceRaw.replace(/[^0-9]/g, '') || '0', 10);
        const next = Math.max(0, current + amount);
        setDropItemPriceRaw(next > 0 ? next.toLocaleString() : '');
      };

      const handleResetAllData = () => {
        if (confirm('정말 모든 데이터를 초기화하시겠습니까?\n등록된 캐릭터, 보스 체크 내역, 주차별 히스토리가 모두 삭제됩니다.')) {
          localStorage.clear();
          setCharacters([]);
          setWeeklyHistory({});
          setActiveCharId('');
          setSyncId('');
          setSyncPassword('');
          setAlertModalMessage('모든 데이터가 초기화되었습니다.');
          window.location.reload();
        }
      };

      useEffect(() => {
        async function fetchCSV() {
          try {
            const res = await fetch(`./bosses.csv?v=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) throw new Error('파일을 찾을 수 없습니다.');

            const text = await res.text();
            const parsed = parseCSV(text);

            if (parsed.length > 0) {
              setBossList(parsed);
              localStorage.setItem('cached_csv_bosses_v12', JSON.stringify(parsed));
            } else {
              throw new Error('데이터 파싱 실패');
            }
          } catch (e) {
            console.warn('CSV 로드 실패, 캐시 확인:', e);
            const cached = localStorage.getItem('cached_csv_bosses_v12');
            if (cached) {
              setBossList(JSON.parse(cached));
            } else {
              setLoadError(true);
            }
          } finally {
            setLoadingBosses(false);
          }
        }
        fetchCSV();
      }, []);

      useEffect(() => {
        if (characters.length > 0 && !characters.some(c => c.id === activeCharId)) {
          setActiveCharId(characters[0].id);
        }
      }, [characters, activeCharId]);

      const handleApiAdd = async (e) => {
        e.preventDefault();
        if (!searchName.trim()) return;

        setIsSearching(true);
        setFormError('');

        try {
          const res = await fetch(
            `${DEFAULT_SB_URL}/functions/v1/get-character?name=${encodeURIComponent(searchName.trim())}`
          );

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || '캐릭터 정보를 불러올 수 없습니다.');
          }

          if (characters.some(c => c.id === data.ocid || c.name === data.name)) {
            throw new Error('이미 등록된 캐릭터입니다.');
          }

          const newChar = {
            id: data.ocid,
            name: data.name,
            job: data.job,
            level: data.level,
            image: data.image,
            clears: {},
            drops: []
          };

          setCharacters(prev => [...prev, newChar]);
          setActiveCharId(data.ocid);
          setSearchName('');
          setShowAddCharModal(false);
        } catch (err) {
          setFormError(err.message || '오류가 발생했습니다.');
        } finally {
          setIsSearching(false);
        }
      };

      const handleManualAdd = (e) => {
        e.preventDefault();
        const trimmedName = manualName.trim();
        if (!trimmedName) {
          setFormError('캐릭터 닉네임을 입력해주세요.');
          return;
        }

        if (characters.some(c => c.name === trimmedName)) {
          setFormError('이미 동일한 닉네임의 캐릭터가 있습니다.');
          return;
        }

        const newId = 'custom_' + Date.now();
        const newChar = {
          id: newId,
          name: trimmedName,
          job: manualJob.trim() || '모험가',
          level: parseInt(manualLevel, 10) || 260,
          image: null,
          clears: {},
          drops: []
        };

        setCharacters(prev => [...prev, newChar]);
        setActiveCharId(newId);
        setManualName('');
        setManualJob('');
        setManualLevel('');
        setFormError('');
        setShowAddCharModal(false);
      };

      // 캐릭터 배열 순서만 변경하며 clears, drops, OCID 등 내부 데이터는 그대로 보존합니다.
      const moveCharacter = (id, direction) => {
        if (!cloudReady || refreshingCharacters || repairingOcid) return;
        setCharacters(prev => {
          const index = prev.findIndex(c => c.id === id);
          const nextIndex = index + direction;
          if (index < 0 || nextIndex < 0 || nextIndex >= prev.length) return prev;
          const next = [...prev];
          [next[index], next[nextIndex]] = [next[nextIndex], next[index]];
          return next;
        });
      };

      const deleteCharacter = (id) => {
        const target = characters.find(c => c.id === id);
        const charName = target ? target.name : '이 캐릭터';
        if (confirm(`정말 [${charName}] 캐릭터를 삭제하시겠습니까?\n등록된 모든 보스 체크 내역과 이 캐릭터의 득템 내역이 영구히 삭제됩니다.`)) {
          setCharacters(prev => prev.filter(c => c.id !== id));
        }
      };

      const resetBossClears = () => {
        if (!activeChar) return;
        if (confirm(`[${activeChar.name}] 캐릭터의 모든 보스 선택을 초기화하시겠습니까?\n(득템 내역은 유지됩니다)`)) {
          setCharacters(prev => prev.map(c => {
            if (c.id !== activeCharId) return c;
            return { ...c, clears: {} };
          }));
        }
      };

      const bossMap = useMemo(() => Object.fromEntries(bossList.map(b => [b.id, b])), [bossList]);

      // 🔥 주간 보스 12개 초과 선택 방지 로직 적용
      const selectBossDifficulty = (bossItem, diffVariantIds) => {
        if (!activeCharId) return;

        setCharacters(prev => prev.map(char => {
          if (char.id !== activeCharId) return char;
          const nextClears = { ...char.clears };

          const existingVariantId = diffVariantIds.find(id => Boolean(nextClears[id]));
          const isTogglingOff = existingVariantId === bossItem.id;

          if (!existingVariantId && bossItem.cycle === 'weekly') {
            const currentWeeklyCount = Object.keys(nextClears).filter(bId => bossMap[bId]?.cycle === 'weekly').length;
            if (currentWeeklyCount >= 12) {
              setAlertModalMessage('주간 보스는 캐릭터당 최대 12개까지만 선택할 수 있습니다.');
              return char;
            }
          }

          diffVariantIds.forEach(id => {
            delete nextClears[id];
          });

          if (!isTogglingOff) {
            nextClears[bossItem.id] = 1;
          }

          return { ...char, clears: nextClears };
        }));
      };

      const setBossPartySize = (bossId, size) => {
        setCharacters(prev => prev.map(char => {
          if (char.id !== activeCharId) return char;
          return {
            ...char,
            clears: { ...char.clears, [bossId]: Math.max(1, Math.min(6, size)) }
          };
        }));
      };

      const handleAddDrop = (e) => {
        e.preventDefault();
        if (!activeCharId) {
          setAlertModalMessage('득템을 등록할 캐릭터를 먼저 선택해주세요!');
          return;
        }
        const numericVal = parseInt(dropItemPriceRaw.replace(/[^0-9]/g, '') || '0', 10);
        if (!dropItemName.trim() || numericVal <= 0) return;

        const afterFee = numericVal * ((100 - dropTaxRate) / 100);
        const finalShare = Math.floor(afterFee / dropPartyCount);

        const newItem = {
          id: 'drop_' + Date.now(),
          charId: activeCharId,
          charName: activeChar.name,
          name: dropItemName.trim(),
          originalPrice: numericVal,
          taxRate: dropTaxRate,
          partyCount: dropPartyCount,
          price: finalShare,
          date: dropDate.trim() || getTodayString()
        };

        setCharacters(prev => prev.map(char => {
          if (char.id !== activeCharId) return char;
          return {
            ...char,
            drops: [...(char.drops || []), newItem]
          };
        }));

        setDropItemName('');
        setDropItemPriceRaw('');
        setDropDate(getTodayString());
      };

      const handleDeleteDrop = (charId, dropId) => {
        setCharacters(prev => prev.map(char => {
          if (char.id !== charId) return char;
          return {
            ...char,
            drops: (char.drops || []).filter(d => d.id !== dropId)
          };
        }));
      };

      const allDrops = useMemo(() => {
        let list = [];
        characters.forEach(char => {
          if (char.drops && Array.isArray(char.drops)) {
            list.push(...char.drops);
          }
        });
        list.sort((a, b) => new Date(b.date) - new Date(a.date));
        return list;
      }, [characters]);

      const totalDropSumAll = allDrops.reduce((sum, d) => sum + d.price, 0);

      const calculation = useMemo(() => {
        const candidateWeeklyCrystals = [];
        let totalDropMesoWeekly = 0;
        let totalDropMesoMonthly = 0;
        let monthlyBossCrystalSum = 0;
        const charWeeklyTotals = {};

        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const currentThursdayTime = getCurrentThursdayResetTime();
        const currentWednesdayEndTime = currentThursdayTime + (7 * 24 * 60 * 60 * 1000) - 1000;

        characters.forEach(char => {
          const charWeekly = [];

          Object.entries(char.clears || {}).forEach(([bId, partySize]) => {
            const boss = bossMap[bId];
            if (!boss) return;

            const unitPrice = Math.floor(boss.price / partySize);

            if (boss.cycle === 'monthly') {
              monthlyBossCrystalSum += unitPrice;
            } else if (boss.cycle === 'weekly') {
              charWeekly.push({
                charId: char.id,
                bossId: boss.id,
                price: unitPrice,
                cycle: 'weekly'
              });
            }
          });

          charWeekly.sort((a, b) => b.price - a.price);
          const top12 = charWeekly.slice(0, 12);
          candidateWeeklyCrystals.push(...top12);
          charWeeklyTotals[char.id] = top12.reduce((sum, item) => sum + item.price, 0);
        });

        allDrops.forEach(d => {
          const dropTime = new Date((d.date || getTodayString()) + 'T00:00:00').getTime();

          if (dropTime >= currentThursdayTime && dropTime <= currentWednesdayEndTime) {
            totalDropMesoWeekly += d.price;
          }

          const dropDateStr = d.date || '';
          const dropYm = dropDateStr.length >= 7 ? dropDateStr.slice(0, 7) : '';
          if (dropYm === currentYearMonth) {
            totalDropMesoMonthly += d.price;
          }
        });

        candidateWeeklyCrystals.sort((a, b) => b.price - a.price);
        const soldWeeklyCrystals = candidateWeeklyCrystals.slice(0, 90);
        const weeklyBossCrystalMeso = soldWeeklyCrystals.reduce((sum, item) => sum + item.price, 0);

        const totalCrystalWeekly = weeklyBossCrystalMeso;
        const grandTotalWeekly = totalCrystalWeekly + totalDropMesoWeekly;

        const totalCrystalMonthly = (weeklyBossCrystalMeso * 4) + monthlyBossCrystalSum;
        const grandTotalMonthly = totalCrystalMonthly + totalDropMesoMonthly;

        return {
          weekly: {
            crystalMeso: totalCrystalWeekly,
            dropMeso: totalDropMesoWeekly,
            grandTotal: grandTotalWeekly,
            soldCount: soldWeeklyCrystals.length
          },
          monthly: {
            crystalMeso: totalCrystalMonthly,
            dropMeso: totalDropMesoMonthly,
            grandTotal: grandTotalMonthly,
            soldCount: soldWeeklyCrystals.length
          },
          charWeeklyTotals
        };
      }, [characters, bossList, allDrops, bossMap]);

      const getCharacterSummary = (char) => {
        let crystalWeeklyList = [];
        let crystalMonthly = 0;
        Object.entries(char.clears || {}).forEach(([bId, partySize]) => {
          const boss = bossMap[bId];
          if (!boss) return;
          const unitPrice = Math.floor(boss.price / partySize);
          if (boss.cycle === 'monthly') crystalMonthly += unitPrice;
          else if (boss.cycle === 'weekly') crystalWeeklyList.push(unitPrice);
        });
        crystalWeeklyList.sort((a, b) => b - a);
        const crystalWeekly = crystalWeeklyList.slice(0, 12).reduce((sum, p) => sum + p, 0);

        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const currentThursdayTime = getCurrentThursdayResetTime();
        const currentWednesdayEndTime = currentThursdayTime + (7 * 24 * 60 * 60 * 1000) - 1000;
        let charDropWeekly = 0;
        let charDropMonthly = 0;
        (char.drops || []).forEach(d => {
          const dropTime = new Date((d.date || getTodayString()) + 'T00:00:00').getTime();
          if (dropTime >= currentThursdayTime && dropTime <= currentWednesdayEndTime) charDropWeekly += d.price;
          if ((d.date || '').slice(0, 7) === currentYearMonth) charDropMonthly += d.price;
        });

        const weeklyTotal = crystalWeekly;
        const monthlyTotal = (crystalWeekly * 4) + crystalMonthly;

        const lastCharMeso = lastWeekSnapshot?.chars?.[char.id];
        const diffWeekly = typeof lastCharMeso === 'number' ? crystalWeekly - lastCharMeso : 0;

        return {
          weeklyTotal,
          monthlyTotal,
          crystalWeekly,
          crystalMonthly,
          dropWeekly: charDropWeekly,
          dropMonthly: charDropMonthly,
          diffWeekly,
          weeklyCount: crystalWeeklyList.length
        };
      };

      useEffect(() => {
        if (!currentWeekKey || calculation.weekly.crystalMeso <= 0) return;
        setWeeklyHistory(prev => {
          const currentEntry = prev[currentWeekKey] || {};
          if (currentEntry.accountTotal === calculation.weekly.crystalMeso) return prev;

          return {
            ...prev,
            [currentWeekKey]: {
              accountTotal: calculation.weekly.crystalMeso,
              chars: calculation.charWeeklyTotals
            }
          };
        });
      }, [currentWeekKey, calculation.weekly.crystalMeso, calculation.charWeeklyTotals]);

      const handleCloneToLastWeekForTest = () => {
        if (calculation.weekly.crystalMeso <= 0) {
          setAlertModalMessage('먼저 보스를 1개 이상 체크한 후 눌러주세요!');
          return;
        }

        const nextHistory = {
          ...weeklyHistory,
          [lastWeekKey]: {
            accountTotal: calculation.weekly.crystalMeso,
            chars: { ...calculation.charWeeklyTotals }
          }
        };

        setWeeklyHistory(nextHistory);
        localStorage.setItem('maple_weekly_history_v2', JSON.stringify(nextHistory));
        setAlertModalMessage(`현재 수익(${formatMeso(calculation.weekly.crystalMeso)})이 지난주(${lastWeekKey}) 기록으로 복제되었습니다!`);
      };

      const lastWeekSnapshot = weeklyHistory[lastWeekKey];
      const accountDiffWeekly = lastWeekSnapshot && typeof lastWeekSnapshot.accountTotal === 'number'
        ? calculation.weekly.crystalMeso - lastWeekSnapshot.accountTotal
        : 0;

      const currentCalc = incomePeriod === 'weekly' ? calculation.weekly : calculation.monthly;

      const activeChar = characters.find(c => c.id === activeCharId);
      const activeCharSummary = activeChar ? getCharacterSummary(activeChar) : null;
      const activeCharWeeklyCount = activeCharSummary ? activeCharSummary.weeklyCount : 0;
      const activeCharMonthlyCount = Object.keys(activeChar?.clears || {}).filter(bId => bossMap[bId]?.cycle === 'monthly').length;

      const currentInputPrice = parseInt(dropItemPriceRaw.replace(/[^0-9]/g, '') || '0', 10);
      const previewMyShare = currentInputPrice > 0
        ? Math.floor((currentInputPrice * ((100 - dropTaxRate) / 100)) / dropPartyCount)
        : 0;

      const { weeklyMultiBosses, weeklySingleBosses, monthlyBosses } = useMemo(() => {
        const diffOrder = { '이지': 1, '노말': 2, '하드': 3, '카오스': 4, '익스트림': 5 };

        const groupByCycleStrictOrder = (targetCycle) => {
          const map = new Map();
          bossList
            .filter(b => b.cycle === targetCycle)
            .forEach(b => {
              if (!map.has(b.name)) {
                map.set(b.name, { name: b.name, cycle: b.cycle, variants: [] });
              }
              map.get(b.name).variants.push(b);
            });

          const list = Array.from(map.values());
          list.forEach(boss => {
            boss.variants.sort((a, b) => (diffOrder[a.difficulty] || 9) - (diffOrder[b.difficulty] || 9));
          });

          return list;
        };

        const weeklyList = groupByCycleStrictOrder('weekly');
        const monthlyList = groupByCycleStrictOrder('monthly');

        return {
          weeklyMultiBosses: weeklyList.filter(b => b.variants.length > 1),
          weeklySingleBosses: weeklyList.filter(b => b.variants.length === 1),
          monthlyBosses: monthlyList
        };
      }, [bossList]);

      const themeContainer = isDark ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900';
      const themeCard = isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm';
      const themeInnerInput = isDark ? 'bg-slate-950 border-slate-800 text-white placeholder-slate-500' : 'bg-slate-100 border-slate-300 text-slate-900 placeholder-slate-400';
      const themeInnerBox = isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-200';

      const getBadgeColor = (diff, isSelected) => {
        if (isSelected) {
          if (diff === '익스트림') return 'bg-purple-600 text-white border-purple-500 font-bold shadow';
          if (diff === '하드') return 'bg-rose-600 text-white border-rose-500 font-bold shadow';
          if (diff === '카오스') return 'bg-amber-600 text-white border-amber-500 font-bold shadow';
          if (diff === '노말') return 'bg-sky-600 text-white border-sky-500 font-bold shadow';
          return 'bg-emerald-600 text-white border-emerald-500 font-bold';
        } else {
          if (isDark) {
            if (diff === '익스트림') return 'bg-purple-950/40 text-purple-400 border-purple-900/50 hover:bg-purple-900/40';
            if (diff === '하드') return 'bg-rose-950/40 text-rose-400 border-rose-900/50 hover:bg-rose-900/40';
            if (diff === '카오스') return 'bg-amber-950/40 text-amber-400 border-amber-900/50 hover:bg-amber-900/40';
            if (diff === '노말') return 'bg-sky-950/40 text-sky-400 border-sky-900/50 hover:bg-sky-900/40';
            return 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800';
          } else {
            if (diff === '익스트림') return 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100';
            if (diff === '하드') return 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100';
            if (diff === '카오스') return 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100';
            if (diff === '노말') return 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100';
            return 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
          }
        }
      };

      const renderBossRow = (bossGroup) => {
        const variantIds = bossGroup.variants.map(v => v.id);
        const isSingle = bossGroup.variants.length === 1;
        const singleVariant = isSingle ? bossGroup.variants[0] : null;

        const selectedVariant = bossGroup.variants.find(v => Boolean(activeChar?.clears?.[v.id]));
        const isAnySelected = Boolean(selectedVariant);
        const partySize = selectedVariant ? (activeChar?.clears?.[selectedVariant.id] || 1) : 1;
        const unitPrice = selectedVariant ? Math.floor(selectedVariant.price / partySize) : 0;

        if (isSingle) {
          return (
            <div
              key={bossGroup.name}
              onClick={() => activeChar && selectBossDifficulty(singleVariant, variantIds)}
              className={`px-3.5 py-2.5 rounded-2xl border transition-all flex items-center justify-between select-none ${
                activeChar ? 'cursor-pointer' : 'cursor-not-allowed'
              } ${
                isAnySelected
                  ? (isDark ? 'bg-slate-900 border-sky-500/80 shadow-md' : 'bg-sky-50/70 border-sky-400 shadow-sm')
                  : (isDark ? 'bg-slate-900/50 border-slate-800/80 hover:bg-slate-900/70' : 'bg-white border-slate-200 hover:bg-slate-50')
              }`}
            >
              <div className="flex items-center gap-3">
                <BossImage name={bossGroup.name} isDark={isDark} />
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className={`text-[10px] px-1.5 py-0.5 rounded-lg border font-bold ${getBadgeColor(singleVariant.difficulty, isAnySelected)}`}>
                      {singleVariant.difficulty}
                    </span>
                    <span className={`text-sm font-extrabold ${
                      isAnySelected
                        ? (isDark ? 'text-white' : 'text-sky-950')
                        : (isDark ? 'text-slate-200' : 'text-slate-800')
                    }`}>
                      {bossGroup.name}
                    </span>
                  </div>
                  <div className={`text-xs mt-0.5 whitespace-nowrap ${
                    isAnySelected
                      ? 'text-sky-500 font-bold'
                      : (isDark ? 'text-slate-400' : 'text-slate-500')
                  }`}>
                    {formatMeso(unitPrice || singleVariant.price)}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {isAnySelected && (
                  <div
                    onClick={e => e.stopPropagation()}
                    className={`flex items-center gap-1.5 px-2 py-1 rounded-xl border ${themeInnerBox}`}
                  >
                    <button
                      type="button"
                      onClick={() => setBossPartySize(singleVariant.id, partySize - 1)}
                      className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${
                        isDark ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'
                      }`}
                    >
                      -
                    </button>
                    <span className="text-xs px-1 text-sky-500 font-bold whitespace-nowrap">{partySize}인</span>
                    <button
                      type="button"
                      onClick={() => setBossPartySize(singleVariant.id, partySize + 1)}
                      className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${
                        isDark ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'
                      }`}
                    >
                      +
                    </button>
                  </div>
                )}

                <div className={`w-5 h-5 rounded-lg flex items-center justify-center text-xs font-black ${
                  isAnySelected
                    ? 'bg-sky-500 text-slate-950 shadow-sm'
                    : (isDark ? 'border border-slate-700' : 'border border-slate-300')
                }`}>
                  {isAnySelected && '✓'}
                </div>
              </div>
            </div>
          );
        }

        return (
          <div
            key={bossGroup.name}
            className={`px-3.5 py-2.5 rounded-2xl border transition-all flex items-center justify-between gap-3 ${
              isAnySelected
                ? (bossGroup.cycle === 'monthly'
                    ? (isDark ? 'bg-slate-900 border-purple-500/80 shadow-md' : 'bg-purple-50/70 border-purple-400 shadow-sm')
                    : (isDark ? 'bg-slate-900 border-sky-500/80 shadow-md' : 'bg-sky-50/70 border-sky-400 shadow-sm'))
                : (isDark ? 'bg-slate-900/50 border-slate-800/80' : 'bg-white border-slate-200')
            }`}
          >
            <div className="flex items-center gap-3 min-w-[120px]">
              <BossImage name={bossGroup.name} isDark={isDark} />
              <div>
                <div className={`text-sm font-extrabold leading-snug ${
                  isAnySelected
                    ? (isDark ? 'text-white' : 'text-sky-950')
                    : (isDark ? 'text-slate-200' : 'text-slate-800')
                }`}>
                  {bossGroup.name}
                </div>
                {isAnySelected ? (
                  <div className={`text-xs font-bold mt-0.5 whitespace-nowrap ${
                    bossGroup.cycle === 'monthly' ? 'text-purple-400' : 'text-sky-500'
                  }`}>
                    {formatMeso(unitPrice)}
                  </div>
                ) : (
                  <div className={`text-[10px] mt-0.5 ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>
                    선택안됨
                  </div>
                )}
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap justify-end flex-1">
              {bossGroup.variants.map(v => {
                const isSelected = activeChar?.clears?.[v.id];

                return (
                  <button
                    key={v.id}
                    type="button"
                    disabled={!activeChar}
                    onClick={() => selectBossDifficulty(v, variantIds)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all active:scale-95 whitespace-nowrap ${getBadgeColor(v.difficulty, isSelected)} ${
                      !activeChar ? 'opacity-50 cursor-not-allowed' : ''
                    }`}
                  >
                    {v.difficulty}
                  </button>
                );
              })}

              {isAnySelected && (
                <div className={`flex items-center gap-1.5 px-2 py-1 rounded-xl border ml-1 ${themeInnerBox}`}>
                  <button
                    type="button"
                    onClick={() => setBossPartySize(selectedVariant.id, partySize - 1)}
                    className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${
                      isDark ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    -
                  </button>
                  <span className={`text-xs px-1 font-bold whitespace-nowrap ${
                    bossGroup.cycle === 'monthly' ? 'text-purple-400' : 'text-sky-500'
                  }`}>{partySize}인</span>
                  <button
                    type="button"
                    onClick={() => setBossPartySize(selectedVariant.id, partySize + 1)}
                    className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${
                      isDark ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    +
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className={`min-h-screen pb-24 font-sans transition-colors duration-200 ${themeContainer}`}>
          <div className="max-w-7xl mx-auto px-4 py-6">

            {/* 상단 통합 헤더 */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-800/40">
              <div className="flex items-center justify-between sm:justify-start gap-3">
                <h1 className={`text-lg sm:text-xl font-extrabold tracking-tight ${isDark ? 'text-slate-100' : 'text-slate-900'}`}>
                  메이플 보스 수익 계산기
                </h1>
                <span className={`text-[10px] sm:text-[11px] px-2 py-0.5 rounded-full border font-semibold shrink-0 ${
                  syncStatus.includes('클라우드 연동됨') ? 'bg-emerald-950/50 text-emerald-400 border-emerald-800/60' :
                  syncStatus === '저장 중...' || syncStatus === '불러오는 중...' ? 'bg-sky-950/50 text-sky-400 border-sky-800/60' :
                  'bg-slate-900 text-slate-400 border-slate-800'
                }`}>
                  {syncStatus}
                </span>
              </div>

              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                <button
                  type="button"
                  onClick={handleCloneToLastWeekForTest}
                  className={`text-xs px-2.5 py-1.5 border rounded-xl font-semibold transition-all shrink-0 active:scale-95 whitespace-nowrap ${
                    isDark
                      ? 'bg-purple-950/60 border-purple-800/80 text-purple-300 hover:bg-purple-900/60'
                      : 'bg-purple-50 border-purple-300 text-purple-800 hover:bg-purple-100'
                  }`}
                  title="현재 보스 결정석 수익을 가상의 지난주 데이터로 복제 저장합니다."
                >
                  🧪 지난주 데이터로 복사
                </button>

                <button
                  type="button"
                  onClick={toggleTheme}
                  className={`text-xs px-2.5 py-1.5 border rounded-xl transition-all flex items-center gap-1 font-semibold shrink-0 whitespace-nowrap ${
                    isDark
                      ? 'bg-slate-800 border-slate-700 text-amber-300 hover:bg-slate-700'
                      : 'bg-white border-slate-300 text-indigo-600 hover:bg-slate-100 shadow-sm'
                  }`}
                >
                  <span>{isDark ? '🌙 다크' : '☀️ 라이트'}</span>
                </button>

                <button
                  onClick={() => {
                    setTempSyncId(syncId || '');
                    setTempSyncPassword('');
                    setSyncMode(syncId ? 'login' : 'register');
                    setShowSyncModal(true);
                  }}
                  className={`text-xs px-2.5 py-1.5 border rounded-xl font-semibold transition-colors shrink-0 whitespace-nowrap ${
                    isDark
                      ? (syncId ? 'bg-slate-800 border-slate-700 text-emerald-400 hover:text-emerald-300' : 'bg-sky-950/60 border-sky-800/80 text-sky-300')
                      : (syncId ? 'bg-white border-slate-300 text-emerald-700 hover:bg-slate-100' : 'bg-sky-50 border-sky-300 text-sky-800')
                  }`}
                >
                  {syncId ? `☁️ 연동됨 (${syncId})` : '☁️ 계정 연동'}
                </button>

                <button
                  type="button"
                  onClick={handleResetAllData}
                  className={`text-xs px-2.5 py-1.5 border rounded-xl font-semibold transition-colors shrink-0 whitespace-nowrap ${
                    isDark
                      ? 'bg-rose-950/60 border-rose-900/80 text-rose-400 hover:bg-rose-900/60'
                      : 'bg-rose-50 border-rose-200 text-rose-700 hover:bg-rose-100'
                  }`}
                  title="모든 데이터 초기화"
                >
                  초기화
                </button>
              </div>
            </div>

            {/* 메인 레이아웃: 대시보드(최상단) -> [좌: 캐릭터 / 우: 보스목록] */}
            <div className="space-y-6">

              {/* [1. 전체 계정 총 예상 수익 대시보드] */}
              <div className={`border rounded-2xl p-5 shadow-lg sticky top-2 z-20 backdrop-blur-md transition-colors ${
                isDark ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200 shadow-md'
              }`}>
                <div className="flex items-center justify-between">
                  <div className="text-[11px] font-semibold text-emerald-500 uppercase tracking-wider flex items-center gap-1.5 flex-wrap">
                    <span className="whitespace-nowrap">{incomePeriod === 'weekly' ? '전체 계정 주간 총 예상 수익' : '전체 계정 월간 예상 수익'}</span>
                    <DiffBadge diff={incomePeriod === 'weekly' ? accountDiffWeekly : accountDiffWeekly * 4} />
                  </div>
                  <div className={`flex items-center p-0.5 rounded-lg border text-[10px] font-bold shrink-0 ${themeInnerBox}`}>
                    <button
                      type="button"
                      onClick={() => setIncomePeriod('weekly')}
                      className={`px-2.5 py-0.5 rounded-md transition-all ${
                        incomePeriod === 'weekly'
                          ? 'bg-emerald-600 text-white shadow'
                          : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                      }`}
                    >
                      주간
                    </button>
                    <button
                      type="button"
                      onClick={() => setIncomePeriod('monthly')}
                      className={`px-2.5 py-0.5 rounded-md transition-all ${
                        incomePeriod === 'monthly'
                          ? 'bg-emerald-600 text-white shadow'
                          : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                      }`}
                    >
                      월간
                    </button>
                  </div>
                </div>

                <div className="mt-1">
                  <div className={`text-2xl font-black tracking-tight whitespace-nowrap ${isDark ? 'text-white' : 'text-slate-900'}`}>
                    {formatMeso(currentCalc.grandTotal)}
                  </div>
                </div>

                <div className={`grid grid-cols-2 gap-3 mt-3 pt-3 border-t text-xs ${isDark ? 'border-slate-800/80' : 'border-slate-100'}`}>
                  <div>
                    <span className={`block text-[11px] whitespace-nowrap ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                      전체 결정석 합산 {incomePeriod === 'weekly' ? `(주간 ${currentCalc.soldCount}/90개)` : '(월 환산)'}
                    </span>
                    <div className="mt-0.5">
                      <span className="font-bold text-sm text-sky-500 whitespace-nowrap">{formatMeso(currentCalc.crystalMeso)}</span>
                    </div>
                  </div>
                  <div>
                    <span className={`block text-[11px] whitespace-nowrap ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                      전체 득템 실 수령액 {incomePeriod === 'monthly' ? '(이번 달)' : '(이번 주)'}
                    </span>
                    <span className="font-bold text-sm text-amber-500 mt-0.5 block whitespace-nowrap">{formatMeso(currentCalc.dropMeso)}</span>
                  </div>
                </div>

                <div className={`w-full h-2 rounded-full mt-3 overflow-hidden ${isDark ? 'bg-slate-800' : 'bg-slate-200'}`}>
                  <div
                    className="bg-sky-500 h-full rounded-full transition-all duration-300"
                    style={{ width: `${Math.min(100, (currentCalc.soldCount / 90) * 100)}%` }}
                  ></div>
                </div>
              </div>

              {/* [2단 배치] */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                {/* [보유 캐릭터 목록] */}
                <div className="lg:col-span-4 space-y-4">
                  <div className={`border rounded-2xl p-3 sm:p-4 transition-colors ${themeCard}`}>
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                      <span className={`text-xs font-extrabold ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>
                        보유 캐릭터 목록 ({characters.length})
                      </span>
                      <div className="flex flex-wrap items-center gap-1.5">
                        <button type="button" disabled={refreshingCharacters || !cloudReady || isReorderingCharacters}
                          onClick={() => refreshCharacterInfo(false, false)}
                          className="text-[11px] px-2 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold">
                          {refreshingCharacters ? '갱신 중...' : '↻ 갱신'}
                        </button>
                        <button type="button" disabled={!cloudReady || refreshingCharacters || repairingOcid}
                          onClick={() => setIsReorderingCharacters(v => !v)}
                          className={`text-[11px] px-2 py-1.5 rounded-lg font-bold disabled:opacity-50 ${isReorderingCharacters ? 'bg-sky-600 text-white' : (isDark ? 'bg-slate-700 text-slate-200' : 'bg-slate-200 text-slate-700')}`}>
                          {isReorderingCharacters ? '✓ 편집 완료' : '캐릭터 편집'}
                        </button>
                        <button type="button" disabled={isReorderingCharacters}
                          onClick={() => { setAddMode('api'); setFormError(''); setShowAddCharModal(true); }}
                          className="text-[11px] px-2 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white font-bold">
                          + 추가
                        </button>
                      </div>
                    </div>
                    {refreshReport && (
                      <div className="mb-3 text-[11px] flex flex-wrap items-center justify-between gap-2">
                        <span className={refreshReport.failures.length ? 'text-amber-500' : 'text-emerald-500'}>
                          최근 갱신: 성공 {refreshReport.success}명 / 실패 {refreshReport.failures.length}명
                        </span>
                        <button type="button" onClick={() => setShowRefreshReport(true)} className="text-sky-500 underline">상세 결과</button>
                      </div>
                    )}
                    {isReorderingCharacters && (
                      <div className={`mb-3 text-[11px] rounded-lg px-3 py-2 ${isDark ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-600'}`}>
                        화살표로 순서를 바꾸고 '편집 완료'를 누르세요. 순서는 자동 저장됩니다.
                      </div>
                    )}
                    {characters.length === 0 ? (
                      <div className={`text-center py-6 text-xs border border-dashed rounded-xl ${isDark ? 'text-slate-500 border-slate-800' : 'text-slate-400 border-slate-300'}`}>
                        등록된 캐릭터가 없습니다.
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 gap-2 sm:gap-3 max-h-[650px] overflow-y-auto pr-0.5 sm:pr-1 no-scrollbar">
                        {characters.map((c, index) => {
                          const summary = getCharacterSummary(c);
                          const isSelected = activeCharId === c.id;
                          const charDisplayTotal = incomePeriod === 'weekly' ? summary.weeklyTotal : summary.monthlyTotal;
                          const charDiff = incomePeriod === 'weekly' ? summary.diffWeekly : summary.diffWeekly * 4;
                          return (
                            <div key={c.id}
                              role={isReorderingCharacters ? undefined : 'button'}
                              tabIndex={isReorderingCharacters ? -1 : 0}
                              onKeyDown={e => { if (!isReorderingCharacters && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setActiveCharId(c.id); } }}
                              onClick={() => { if (!isReorderingCharacters) setActiveCharId(c.id); }}
                              className={`min-w-0 rounded-xl border overflow-hidden transition-all ${isReorderingCharacters ? '' : 'cursor-pointer'} ${
                                isSelected
                                  ? (isDark ? 'bg-sky-950/60 border-sky-500 shadow-sm' : 'bg-sky-50 border-sky-500 shadow-sm')
                                  : (isDark ? 'bg-slate-900/70 border-slate-800 hover:border-slate-600' : 'bg-white border-slate-200 hover:border-slate-400')
                              }`}
                            >
                              <div className="relative flex items-center justify-center h-[88px] sm:h-24 overflow-hidden"
                                style={{ background: isDark ? 'radial-gradient(ellipse at center, #263c55 0%, #121c2e 75%)' : 'radial-gradient(ellipse at center, #dbeafe 0%, #f1f5f9 75%)' }}>
                                {c.image ? (
                                  <img src={c.image} alt={`${c.name} 캐릭터 코디`} loading="lazy"
                                    className="h-full w-full object-contain drop-shadow-lg"
                                    style={{ imageRendering: 'auto', transform: 'scale(1.6)', transformOrigin: 'center center' }} />
                                ) : (
                                  <div className="w-14 h-14 rounded-full bg-sky-600/30 border border-sky-500/40 flex items-center justify-center text-xl font-bold text-sky-400">
                                    {c.name.slice(0, 1)}
                                  </div>
                                )}
                                {isSelected && !isReorderingCharacters && (
                                  <span className="absolute top-1.5 left-1.5 text-[10px] font-bold rounded-md bg-sky-500 text-white px-1.5 py-0.5">선택됨</span>
                                )}
                                {isReorderingCharacters && (
                                  <div className="absolute inset-x-1 bottom-1 flex justify-center gap-1">
                                    <button type="button" disabled={index === 0} onClick={e => { e.stopPropagation(); moveCharacter(c.id, -1); }}
                                      className="bg-slate-950/90 border border-slate-600 text-white rounded-lg px-3 py-1.5 disabled:opacity-30" title="위로 이동">↑</button>
                                    <button type="button" disabled={index === characters.length - 1} onClick={e => { e.stopPropagation(); moveCharacter(c.id, 1); }}
                                      className="bg-slate-950/90 border border-slate-600 text-white rounded-lg px-3 py-1.5 disabled:opacity-30" title="아래로 이동">↓</button>
                                    <button type="button" onClick={e => { e.stopPropagation(); deleteCharacter(c.id); }}
                                      className="bg-rose-950/90 border border-rose-700 text-rose-300 rounded-lg px-2 py-1.5" title="캐릭터 삭제">✕</button>
                                  </div>
                                )}
                              </div>
                              <div className="px-1.5 sm:px-2 py-1.5 text-center min-w-0">
                                <div className={`text-xs sm:text-sm font-extrabold truncate ${isDark ? 'text-slate-100' : 'text-slate-900'}`} title={c.name}>{c.name}</div>
                                <div className={`text-[10px] truncate mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`} title={`${c.job || ''} · Lv.${c.level}`}>
                                  {c.job ? `${c.job} · ` : ''}Lv.{c.level}
                                </div>
                                <div className="mt-1 pt-1 border-t border-slate-500/20">
                                  <div className={`text-[9px] ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>{incomePeriod === 'weekly' ? '주간 예상 수익' : '월간 예상 수익'}</div>
                                  <div className="text-[11px] sm:text-xs font-black text-sky-500 leading-snug break-words [overflow-wrap:anywhere]" title={formatMeso(charDisplayTotal)}>{formatMeso(charDisplayTotal)}</div>
                                  <div className="flex justify-center"><DiffBadge diff={charDiff} /></div>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                {/* [보스 체크리스트 및 득템 정산] */}
                <div className="lg:col-span-8 space-y-4">

                  {activeChar && (
                    <div className={`border rounded-2xl p-4 transition-colors ${themeCard}`}>
                      <div className="flex items-center justify-between mb-3 text-xs">
                        <div>
                          {mainTab === 'weekly' && (
                            <span className={isDark ? 'text-slate-300' : 'text-slate-600'}>
                              [{activeChar.name}] 주간 보스 클리어:&nbsp;
                              <strong className={`font-black ${activeCharWeeklyCount === 12 ? 'text-amber-400' : 'text-sky-500'}`}>
                                {activeCharWeeklyCount}
                              </strong> / 12개 {activeCharWeeklyCount >= 12 && <span className="text-amber-400 font-bold">(선택 완료)</span>}
                            </span>
                          )}
                          {mainTab === 'monthly' && (
                            <span className={isDark ? 'text-slate-300' : 'text-slate-600'}>
                              [{activeChar.name}] 월간 보스 클리어: <strong className="text-purple-400 font-bold">{activeCharMonthlyCount}</strong>개
                            </span>
                          )}
                          {mainTab === 'drop' && (
                            <span className={isDark ? 'text-slate-300' : 'text-slate-600'}>
                              전체 등록된 득템: <strong className="text-amber-500 font-bold">{allDrops.length}</strong>개 (득템 등록 캐릭터: <strong className="text-sky-400">{activeChar.name}</strong>)
                            </span>
                          )}
                        </div>
                      </div>

                      <div className={`grid grid-cols-3 gap-1 p-1 rounded-xl border mb-2 shadow-sm ${themeInnerBox}`}>
                        <button
                          type="button"
                          onClick={() => setMainTab('weekly')}
                          className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1 ${
                            mainTab === 'weekly'
                              ? 'bg-sky-600 text-white shadow'
                              : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                          }`}
                        >
                          <span>📅</span>
                          <span>주간 보스</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => setMainTab('monthly')}
                          className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1 ${
                            mainTab === 'monthly'
                              ? 'bg-purple-600 text-white shadow'
                              : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                          }`}
                        >
                          <span>🌌</span>
                          <span>월간 보스</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => setMainTab('drop')}
                          className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1 ${
                            mainTab === 'drop'
                              ? 'bg-amber-600 text-white shadow'
                              : (isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800')
                          }`}
                        >
                          <span>✨</span>
                          <span>득템 정산</span>
                        </button>
                      </div>

                      {mainTab !== 'drop' && (
                        <div className="flex items-center justify-between px-1 pt-1 text-xs">
                          <span className={`text-[11px] font-medium ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>

                              isDark
                                ? 'bg-slate-900 border-slate-700 text-amber-400 hover:bg-slate-800'
                                : 'bg-white border-slate-300 text-amber-700 hover:bg-slate-50 shadow-sm'
                            }`}
                          >
                            <span>🔄</span>
                            <span>보스 선택 초기화</span>
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                    </div>
                  ) : !activeChar ? (
                    <div className={`border rounded-2xl p-10 text-center text-xs ${isDark ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-white border-slate-200 text-slate-500 shadow-sm'}`}>

                    </div>

                          {loadingBosses ? (
                            <div className="text-center py-10 text-sm text-slate-500">bosses.csv 로드 중...</div>

                            <div className="p-4 bg-rose-950/40 border border-rose-900 rounded-xl text-center text-xs text-rose-400">

                            </div>

                            <div className="space-y-4">
                              {weeklyMultiBosses.length > 0 && (
                                <div className="space-y-2">

                                    <span>난이도 선택 보스 ({weeklyMultiBosses.length}종)</span>

                                <div>

                                    {weeklySingleBosses.map(bossGroup => {
                                      const singleVariant = bossGroup.variants[0];
                                      const variantIds = [singleVariant.id];
                                      const isSelected = Boolean(activeChar?.clears?.[singleVariant.id]);
                                      const partySize = isSelected ? (activeChar?.clears?.[singleVariant.id] || 1) : 1;
                                      const unitPrice = Math.floor(singleVariant.price / partySize);

                                      return (
                                        <div
                                          key={bossGroup.name}
                                          onClick={() => activeChar && selectBossDifficulty(singleVariant, variantIds)}
                                          className={`p-3 rounded-2xl border transition-all flex items-center justify-between select-none ${
                                            activeChar ? 'cursor-pointer' : 'cursor-not-allowed'
                                          } ${
                                            isSelected
                                              ? (isDark ? 'bg-slate-900 border-sky-500/80 shadow-md' : 'bg-sky-50/70 border-sky-400 shadow-sm')
                                              : (isDark ? 'bg-slate-900/50 border-slate-800/80 hover:bg-slate-900/70' : 'bg-white border-slate-200 hover:bg-slate-50')

                                            <BossImage name={bossGroup.name} isDark={isDark} />

                                                  {singleVariant.difficulty}
                                                </span>
                                                <span className={`text-sm font-extrabold truncate ${
                                                  isSelected
                                                    ? (isDark ? 'text-white' : 'text-sky-950')
                                                    : (isDark ? 'text-slate-200' : 'text-slate-800')
                                                }`}>
                                                  {bossGroup.name}
                                                </span>
                                              </div>
                                              <div className={`text-xs mt-1 whitespace-nowrap ${isSelected ? 'text-sky-500 font-bold' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>
                                                {formatMeso(unitPrice)}
                                              </div>
                                            </div>
                                          </div>

                                          <div className="flex items-center gap-1.5 shrink-0 ml-1">
                                            {isSelected && (
                                              <div
                                                onClick={e => e.stopPropagation()}
                                                className={`flex items-center px-1.5 py-0.5 rounded-lg border text-xs ${themeInnerBox}`}
                                              >
                                                <button
                                                  type="button"
                                                  onClick={() => setBossPartySize(singleVariant.id, partySize - 1)}
                                                  className="w-5 h-5 rounded flex items-center justify-center font-bold"

                                                  -
                                                </button>
                                                <span className="px-1 text-sky-500 font-bold whitespace-nowrap">{partySize}</span>
                                                <button
                                                  type="button"
                                                  onClick={() => setBossPartySize(singleVariant.id, partySize + 1)}
                                                  className="w-5 h-5 rounded flex items-center justify-center font-bold"
                                                >
                                                  +
                                                </button>
                                              </div>
                                            )}
                                            <div className={`w-5 h-5 rounded-lg flex items-center justify-center text-xs font-black ${
                                              isSelected
                                                ? 'bg-sky-500 text-slate-950 shadow-sm'
                                                : (isDark ? 'border border-slate-700' : 'border border-slate-300')
                                            }`}>
                                              {isSelected && '✓'}
                                            </div>
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      )}

                      {mainTab === 'monthly' && (

                          {loadingBosses ? (
                            <div className="text-center py-10 text-sm text-slate-500">bosses.csv 로드 중...</div>

                            <div className="p-4 bg-rose-950/40 border border-rose-900 rounded-xl text-center text-xs text-rose-400">

                            </div>

                              <div className="p-3 bg-purple-950/20 border border-purple-800/30 rounded-2xl text-xs text-purple-300 flex items-center gap-2">

                                <span>월간 보스는 주간 12개 제한을 소모하지 않으며 월 환산 수익에 반영됩니다.</span>

                              {monthlyBosses.map(renderBossRow)}
                            </div>

                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded whitespace-nowrap ${

                                : (isMvpOrPc ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-slate-200 text-slate-600')

                                  onChange={e => setDropDate(e.target.value)}

                                    isDark ? 'bg-slate-900 border-slate-700 text-slate-200' : 'bg-white border-slate-300 text-slate-800'
                                  }`}
