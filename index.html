<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>메이플 보스 수익 계산기</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input, select, button { -webkit-user-select: auto; user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_SB_URL = 'https://pmudomjxhvmnvusfnqhn.supabase.co';

    async function requestSyncApi(action, id, password, data = null) {
      const res = await fetch(`${DEFAULT_SB_URL}/functions/v1/sync-account`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, id, password, data })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || '요청 처리에 실패했습니다.');
      return json;
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getCurrentThursdayResetTime() {
      const now = new Date();
      const day = now.getDay();
      let diff = day - 4;
      if (diff < 0) diff += 7;
      const thursday = new Date(now);
      thursday.setDate(now.getDate() - diff);
      thursday.setHours(0, 0, 0, 0);
      return thursday.getTime();
    }

    function getMapleWeekKey(timestamp = Date.now()) {
      const target = new Date(timestamp);
      const day = target.getDay();
      let diff = day - 4;
      if (diff < 0) diff += 7;
      const thursday = new Date(target);
      thursday.setDate(target.getDate() - diff);
      thursday.setHours(0, 0, 0, 0);

      const yearStart = new Date(thursday.getFullYear(), 0, 1);
      const weekNo = Math.ceil((((thursday - yearStart) / 86400000) + 1) / 7);
      return `${thursday.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function formatMeso(meso) {
      if (!meso && meso !== 0) return '0 메소';
      const absVal = Math.abs(meso);
      const jo = Math.floor(absVal / 1000000000000);
      const eok = Math.floor((absVal % 1000000000000) / 100000000);
      const man = Math.floor((absVal % 100000000) / 10000);
      const won = Math.floor(absVal % 10000);

      const parts = [];
      if (jo > 0) parts.push(`${jo.toLocaleString()}조`);
      if (eok > 0) parts.push(`${eok.toLocaleString()}억`);
      if (man > 0) parts.push(`${man.toLocaleString()}만`);
      if (won > 0 && jo === 0 && eok === 0) parts.push(`${won.toLocaleString()}`);
      
      const res = parts.length > 0 ? parts.join(' ') + ' 메소' : `${absVal.toLocaleString()} 메소`;
      return meso < 0 ? `-${res}` : res;
    }

    function parseCSV(text) {
      const cleanText = text.replace(/^\uFEFF/, '').trim();
      const lines = cleanText.split(/\r?\n/);
      if (lines.length < 2) return [];

      const rawHeaders = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, '').toLowerCase());

      return lines.slice(1).map(line => {
        if (!line.trim()) return null;
        
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim().replace(/^["']|["']$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim().replace(/^["']|["']$/g, ''));

        const obj = {};
        rawHeaders.forEach((h, i) => {
          if (h) obj[h] = result[i] !== undefined ? result[i] : '';
        });

        const cycle = (obj.cycle || 'weekly').trim().toLowerCase();
        if (cycle === 'daily') return null;

        const pBefore = parseInt(String(obj.price_before || obj.price || '0').replace(/[^0-9]/g, ''), 10) || 0;
        const pAfter = parseInt(String(obj.price_after || obj.price || '0').replace(/[^0-9]/g, ''), 10) || pBefore;

        return {
          id: obj.id,
          name: obj.name,
          difficulty: obj.difficulty,
          cycle: cycle,
          priceBefore: pBefore,
          priceAfter: pAfter,
          price: pBefore
        };
      }).filter(item => item && item.id && (item.priceBefore > 0 || item.priceAfter > 0));
    }

    function BossImage({ name, isDark }) {
      const [imgFailed, setImgFailed] = useState(false);

      if (imgFailed) {
        return (
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm shrink-0 border ${
            isDark ? 'bg-slate-800 text-sky-400 border-slate-700' : 'bg-sky-100 text-sky-700 border-sky-200'
          }`}>
            {name.slice(0, 1)}
          </div>
        );
      }

      return (
        <img
          src={`./images/${encodeURIComponent(name)}.png`}
          alt=""
          onError={() => setImgFailed(true)}
          className="w-10 h-10 rounded-xl object-contain bg-slate-900/40 border border-slate-700/60 shrink-0 shadow-sm"
        />
      );
    }

    function DiffBadge({ diff }) {
      if (!diff || diff === 0 || isNaN(diff)) return null;
      const isPlus = diff > 0;
      return (
        <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-extrabold shrink-0 whitespace-nowrap inline-flex items-center gap-0.5 ${
          isPlus 
            ? 'bg-emerald-950/70 text-emerald-400 border border-emerald-800/60' 
            : 'bg-rose-950/70 text-rose-400 border border-rose-800/60'
        }`}>
          <span>{isPlus ? '▲ +' : '▼ -'}</span>
          <span>{formatMeso(Math.abs(diff)).replace(' 메소', '')}</span>
        </span>
      );
    }

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('maple_theme') || 'dark');
      const isDark = theme === 'dark';

      const toggleTheme = () => {
        const next = isDark ? 'light' : 'dark';
        setTheme(next);
        localStorage.setItem('maple_theme', next);
      };

      const [syncId, setSyncId] = useState(() => localStorage.getItem('maple_sync_id') || '');
      const [syncPassword, setSyncPassword] = useState(() => localStorage.getItem('maple_sync_pw') || '');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [showAddCharModal, setShowAddCharModal] = useState(false);
      const [syncMode, setSyncMode] = useState('register');
      const [tempSyncId, setTempSyncId] = useState('');
      const [tempSyncPassword, setTempSyncPassword] = useState('');
      const [syncStatus, setSyncStatus] = useState('로컬 모드 (저장됨)');

      const [mainTab, setMainTab] = useState('weekly');
      const [incomePeriod, setIncomePeriod] = useState('weekly');

      const [isMvpOrPc, setIsMvpOrPc] = useState(() => {
        const saved = localStorage.getItem('maple_is_mvp');
        return saved !== null ? JSON.parse(saved) : true;
      });

      const [bossList, setBossList] = useState([]);
      const [loadingBosses, setLoadingBosses] = useState(true);
      const [loadError, setLoadError] = useState(false);

      const [characters, setCharacters] = useState(() => {
        const saved = localStorage.getItem('maple_characters_v2');
        return saved ? JSON.parse(saved) : [];
      });
      const [activeCharId, setActiveCharId] = useState('');

      const [weeklyHistory, setWeeklyHistory] = useState(() => {
        const saved = localStorage.getItem('maple_weekly_history_v2');
        return saved ? JSON.parse(saved) : {};
      });

      const [addMode, setAddMode] = useState('api');
      const [searchName, setSearchName] = useState('');
      const [manualName, setManualName] = useState('');
      const [manualJob, setManualJob] = useState('');
      const [manualLevel, setManualLevel] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [formError, setFormError] = useState('');

      const [dropItemName, setDropItemName] = useState('');
      const [dropItemPriceRaw, setDropItemPriceRaw] = useState('');
      const [dropDate, setDropDate] = useState(getTodayString());
      const [dropTaxRate, setDropTaxRate] = useState(isMvpOrPc ? 3 : 5);
      const [dropPartyCount, setDropPartyCount] = useState(1);

      const currentWeekKey = useMemo(() => getMapleWeekKey(Date.now()), []);
      const lastWeekKey = useMemo(() => getMapleWeekKey(Date.now() - (7 * 24 * 60 * 60 * 1000)), []);

      const handleRegisterAccount = async (targetId, targetPw) => {
        setSyncStatus('계정 생성 중...');
        try {
          const payload = {
            characters,
            isMvpOrPc,
            weeklyHistory,
            updatedAt: new Date().toISOString()
          };
          await requestSyncApi('register', targetId, targetPw, payload);
          setSyncStatus('클라우드 연동됨');
          return true;
        } catch (err) {
          console.error(err);
          setSyncStatus('생성 실패');
          alert(err.message || '계정 생성 중 오류가 발생했습니다.');
          return false;
        }
      };

      const handleLoginAccount = async (targetId, targetPw) => {
        setSyncStatus('불러오는 중...');
        try {
          const res = await requestSyncApi('login', targetId, targetPw);
          if (res.data) {
            const parsed = res.data;
            if (parsed.characters) setCharacters(parsed.characters);
            if (parsed.weeklyHistory) setWeeklyHistory(parsed.weeklyHistory);
            if (typeof parsed.isMvpOrPc === 'boolean') {
              setIsMvpOrPc(parsed.isMvpOrPc);
              setDropTaxRate(parsed.isMvpOrPc ? 3 : 5);
            }
          }
          setSyncStatus('클라우드 연동됨');
          return true;
        } catch (err) {
          console.error(err);
          setSyncStatus('로그인 실패');
          alert(err.message || '로그인 중 오류가 발생했습니다.');
          return false;
        }
      };

      const handleSyncSubmit = async () => {
        const idVal = tempSyncId.trim();
        const pwVal = tempSyncPassword.trim();
        if (!idVal || !pwVal) {
          alert('동기화 ID와 비밀번호를 모두 입력해주세요!');
          return;
        }

        if (syncMode === 'delete') {
          if (!confirm(`[${idVal}] 계정을 클라우드에서 정말 영구히 삭제하시겠습니까?`)) return;

          setSyncStatus('삭제 중...');
          try {
            await requestSyncApi('delete', idVal, pwVal);

            if (syncId === idVal) {
              localStorage.removeItem('maple_sync_id');
              localStorage.removeItem('maple_sync_pw');
              setSyncId('');
              setSyncPassword('');
            }

            setSyncStatus('로컬 모드 (저장됨)');
            setShowSyncModal(false);
            alert('클라우드 계정이 성공적으로 삭제되었습니다.');
          } catch (err) {
            console.error(err);
            setSyncStatus('삭제 오류');
            alert(err.message || '계정 삭제 중 오류가 발생했습니다.');
          }
          return;
        }

        let success = false;
        if (syncMode === 'register') {
          success = await handleRegisterAccount(idVal, pwVal);
        } else {
          success = await handleLoginAccount(idVal, pwVal);
        }

        if (success) {
          localStorage.setItem('maple_sync_id', idVal);
          localStorage.setItem('maple_sync_pw', pwVal);
          setSyncId(idVal);
          setSyncPassword(pwVal);
          setShowSyncModal(false);
          alert(syncMode === 'register' ? '계정이 성공적으로 생성되고 연동되었습니다!' : '기존 계정 데이터를 성공적으로 불러왔습니다!');
        }
      };

      useEffect(() => {
        if (syncId && syncPassword) {
          handleLoginAccount(syncId, syncPassword);
        }
      }, []);

      const isInitialMount = useRef(true);
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        localStorage.setItem('maple_characters_v2', JSON.stringify(characters));
        localStorage.setItem('maple_weekly_history_v2', JSON.stringify(weeklyHistory));

        if (!syncId || !syncPassword) return;

        const timer = setTimeout(async () => {
          setSyncStatus('저장 중...');
          try {
            const payload = {
              characters,
              isMvpOrPc,
              weeklyHistory,
              updatedAt: new Date().toISOString()
            };
            await requestSyncApi('save', syncId, syncPassword, payload);
            setSyncStatus('클라우드 연동됨');
          } catch (err) {
            console.error(err);
            setSyncStatus('저장 실패');
          }
        }, 1000);

        return () => clearTimeout(timer);
      }, [characters, isMvpOrPc, weeklyHistory]);

      const toggleMvpBenefit = (checked) => {
        setIsMvpOrPc(checked);
        localStorage.setItem('maple_is_mvp', JSON.stringify(checked));
        setDropTaxRate(checked ? 3 : 5);
      };

      const addQuickAmount = (amount) => {
        const current = parseInt(dropItemPriceRaw.replace(/[^0-9]/g, '') || '0', 10);
        const next = Math.max(0, current + amount);
        setDropItemPriceRaw(next > 0 ? next.toLocaleString() : '');
      };

      const handleResetAllData = () => {
        if (confirm('정말 모든 데이터를 초기화하시겠습니까?\n등록된 캐릭터, 보스 체크 내역, 주차별 히스토리가 모두 삭제됩니다.')) {
          localStorage.clear();
          setCharacters([]);
          setWeeklyHistory({});
          setActiveCharId('');
          setSyncId('');
          setSyncPassword('');
          alert('모든 데이터가 초기화되었습니다.');
          window.location.reload();
        }
      };

      useEffect(() => {
        async function fetchCSV() {
          try {
            const res = await fetch(`./bosses.csv?v=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) throw new Error('파일을 찾을 수 없습니다.');

            const text = await res.text();
            const parsed = parseCSV(text);

            if (parsed.length > 0) {
              setBossList(parsed);
              localStorage.setItem('cached_csv_bosses_v12', JSON.stringify(parsed));
            } else {
              throw new Error('데이터 파싱 실패');
            }
          } catch (e) {
            console.warn('CSV 로드 실패, 캐시 확인:', e);
            const cached = localStorage.getItem('cached_csv_bosses_v12');
            if (cached) {
              setBossList(JSON.parse(cached));
            } else {
              setLoadError(true);
            }
          } finally {
            setLoadingBosses(false);
          }
        }
        fetchCSV();
      }, []);

      useEffect(() => {
        if (characters.length > 0 && !characters.some(c => c.id === activeCharId)) {
          setActiveCharId(characters[0].id);
        }
      }, [characters, activeCharId]);

      const handleApiAdd = async (e) => {
        e.preventDefault();
        if (!searchName.trim()) return;

        setIsSearching(true);
        setFormError('');

        try {
          const res = await fetch(
            `${DEFAULT_SB_URL}/functions/v1/get-character?name=${encodeURIComponent(searchName.trim())}`,
            { headers: { 'apikey': 'anon' } } // 401 방지용 기본 헤더 추가
          );

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || '캐릭터 정보를 불러올 수 없습니다.');
          }

          if (characters.some(c => c.id === data.ocid || c.name === data.name)) {
            throw new Error('이미 등록된 캐릭터입니다.');
          }

          const newChar = {
            id: data.ocid,
            name: data.name,
            job: data.job,
            level: data.level,
            image: data.image,
            clears: {},
            drops: []
          };

          setCharacters(prev => [...prev, newChar]);
          setActiveCharId(data.ocid);
          setSearchName('');
          setShowAddCharModal(false);
        } catch (err) {
          setFormError(err.message || '오류가 발생했습니다.');
        } finally {
          setIsSearching(false);
        }
      };

      const handleManualAdd = (e) => {
        e.preventDefault();
        const trimmedName = manualName.trim();
        if (!trimmedName) {
          setFormError('캐릭터 닉네임을 입력해주세요.');
          return;
        }

        if (characters.some(c => c.name === trimmedName)) {
          setFormError('이미 동일한 닉네임의 캐릭터가 있습니다.');
          return;
        }

        const newId = 'custom_' + Date.now();
        const newChar = {
          id: newId,
          name: trimmedName,
          job: manualJob.trim() || '모험가',
          level: parseInt(manualLevel, 10) || 260,
          image: null,
          clears: {},
          drops: []
        };

        setCharacters(prev => [...prev, newChar]);
        setActiveCharId(newId);
        setManualName('');
        setManualJob('');
        setManualLevel('');
        setFormError('');
        setShowAddCharModal(false);
      };

      const deleteCharacter = (id) => {
        const target = characters.find(c => c.id === id);
        const charName = target ? target.name : '이 캐릭터';
        if (confirm(`정말 [${charName}] 캐릭터를 삭제하시겠습니까?\n등록된 모든 보스 체크 내역과 이 캐릭터의 득템 내역이 영구히 삭제됩니다.`)) {
          setCharacters(prev => prev.filter(c => c.id !== id));
        }
      };

      const resetBossClears = () => {
        if (!activeChar) return;
        if (confirm(`[${activeChar.name}] 캐릭터의 모든 보스 선택을 초기화하시겠습니까?\n(득템 내역은 유지됩니다)`)) {
          setCharacters(prev => prev.map(c => {
            if (c.id !== activeCharId) return c;
            return { ...c, clears: {} };
          }));
        }
      };

      const selectBossDifficulty = (bossItem, diffVariantIds) => {
        if (!activeCharId) return;

        setCharacters(prev => prev.map(char => {
          if (char.id !== activeCharId) return char;
          const nextClears = { ...char.clears };
          const isCurrentlySelected = Boolean(nextClears[bossItem.id]);

          diffVariantIds.forEach(id => {
            delete nextClears[id];
          });

          if (!isCurrentlySelected) {
            nextClears[bossItem.id] = 1;
          }

          return { ...char, clears: nextClears };
        }));
      };

      const setBossPartySize = (bossId, size) => {
        setCharacters(prev => prev.map(char => {
          if (char.id !== activeCharId) return char;
          return {
            ...char,
            clears: { ...char.clears, [bossId]: Math.max(1, Math.min(6, size)) }
          };
        }));
      };

      const handleAddDrop = (e) => {
        e.preventDefault();
        if (!activeCharId) {
          alert('득템을 등록할 캐릭터를 먼저 선택해주세요!');
          return;
        }
        const numericVal = parseInt(dropItemPriceRaw.replace(/[^0-9]/g, '') || '0', 10);
        if (!dropItemName.trim() || numericVal <= 0) return;

        const afterFee = numericVal * ((100 - dropTaxRate) / 100);
        const finalShare = Math.floor(afterFee / dropPartyCount);

        const newItem = {
          id: 'drop_' + Date.now(),
          charId: activeCharId,
          charName: activeChar.name,
          name: dropItemName.trim(),
          originalPrice: numericVal,
          taxRate: dropTaxRate,
          partyCount: dropPartyCount,
          price: finalShare,
          date: dropDate.trim() || getTodayString()
        };

        setCharacters(prev => prev.map(char => {
          if (char.id !== activeCharId) return char;
          return {
            ...char,
            drops: [...(char.drops || []), newItem]
          };
        }));

        setDropItemName('');
        setDropItemPriceRaw('');
        setDropDate(getTodayString());
      };

      const handleDeleteDrop = (charId, dropId) => {
        setCharacters(prev => prev.map(char => {
          if (char.id !== charId) return char;
          return {
            ...char,
            drops: (char.drops || []).filter(d => d.id !== dropId)
          };
        }));
      };

      const allDrops = useMemo(() => {
        let list = [];
        characters.forEach(char => {
          if (char.drops && Array.isArray(char.drops)) {
            list.push(...char.drops);
          }
        });
        list.sort((a, b) => new Date(b.date) - new Date(a.date));
        return list;
      }, [characters]);

      const totalDropSumAll = allDrops.reduce((sum, d) => sum + d.price, 0);

      const calculation = useMemo(() => {
        const bossMap = Object.fromEntries(bossList.map(b => [b.id, b]));
        
        let totalDropMesoWeekly = 0;
        let totalDropMesoMonthly = 0;

        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const currentThursdayTime = getCurrentThursdayResetTime();
        const currentWednesdayEndTime = currentThursdayTime + (7 * 24 * 60 * 60 * 1000) - 1000;

        let beforeCandidateWeekly = [];
        let beforeMonthlyCrystalSum = 0;

        let afterCandidateWeekly = [];
        let afterMonthlyCrystalSum = 0;

        characters.forEach(char => {
          const charWeeklyBefore = [];
          const charWeeklyAfter = [];

          Object.entries(char.clears || {}).forEach(([bId, partySize]) => {
            const boss = bossMap[bId];
            if (!boss) return;

            const unitBefore = Math.floor(boss.priceBefore / partySize);
            const unitAfter = Math.floor(boss.priceAfter / partySize);

            if (boss.cycle === 'monthly') {
              beforeMonthlyCrystalSum += unitBefore;
              afterMonthlyCrystalSum += unitAfter;
            } else if (boss.cycle === 'weekly') {
              charWeeklyBefore.push({ price: unitBefore });
              charWeeklyAfter.push({ price: unitAfter });
            }
          });

          charWeeklyBefore.sort((a, b) => b.price - a.price);
          beforeCandidateWeekly.push(...charWeeklyBefore.slice(0, 12));

          charWeeklyAfter.sort((a, b) => b.price - a.price);
          afterCandidateWeekly.push(...charWeeklyAfter.slice(0, 12));
        });

        allDrops.forEach(d => {
          const dropTime = new Date((d.date || getTodayString()) + 'T00:00:00').getTime();
          if (dropTime >= currentThursdayTime && dropTime <= currentWednesdayEndTime) {
            totalDropMesoWeekly += d.price;
          }
          if ((d.date || '').slice(0, 7) === currentYearMonth) {
            totalDropMesoMonthly += d.price;
          }
        });

        beforeCandidateWeekly.sort((a, b) => b.price - a.price);
        const soldBeforeWeekly = beforeCandidateWeekly.slice(0, 90);
        const crystalBeforeWeekly = soldBeforeWeekly.reduce((sum, item) => sum + item.price, 0);

        afterCandidateWeekly.sort((a, b) => b.price - a.price);
        const soldAfterWeekly = afterCandidateWeekly.slice(0, 90);
        const crystalAfterWeekly = soldAfterWeekly.reduce((sum, item) => sum + item.price, 0);

        const totalBeforeWeeklyVal = crystalBeforeWeekly + totalDropMesoWeekly;
        const totalAfterWeeklyVal = crystalAfterWeekly + totalDropMesoWeekly;
        const diffWeeklyVal = totalAfterWeeklyVal - totalBeforeWeeklyVal;
        const percentWeekly = totalBeforeWeeklyVal > 0 ? ((diffWeeklyVal / totalBeforeWeeklyVal) * 100).toFixed(2) : '0.00';

        const totalBeforeMonthlyVal = (crystalBeforeWeekly * 4) + beforeMonthlyCrystalSum + totalDropMesoMonthly;
        const totalAfterMonthlyVal = (crystalAfterWeekly * 4) + afterMonthlyCrystalSum + totalDropMesoMonthly;
        const diffMonthlyVal = totalAfterMonthlyVal - totalBeforeMonthlyVal;
        const percentMonthly = totalBeforeMonthlyVal > 0 ? ((diffMonthlyVal / totalBeforeMonthlyVal) * 100).toFixed(2) : '0.00';

        return {
          weekly: {
            before: totalBeforeWeeklyVal,
            after: totalAfterWeeklyVal,
            diff: diffWeeklyVal,
            percent: percentWeekly
          },
          monthly: {
            before: totalBeforeMonthlyVal,
            after: totalAfterMonthlyVal,
            diff: diffMonthlyVal,
            percent: percentMonthly
          }
        };
      }, [characters, bossList, allDrops]);

      const bossMap = useMemo(() => Object.fromEntries(bossList.map(b => [b.id, b])), [bossList]);

      const getCharacterSummary = (char) => {
        let weeklyBeforeList = [];
        let weeklyAfterList = [];
        let monthlyBefore = 0;
        let monthlyAfter = 0;

        Object.entries(char.clears || {}).forEach(([bId, partySize]) => {
          const boss = bossMap[bId];
          if (!boss) return;
          const unitBefore = Math.floor(boss.priceBefore / partySize);
          const unitAfter = Math.floor(boss.priceAfter / partySize);

          if (boss.cycle === 'monthly') {
            monthlyBefore += unitBefore;
            monthlyAfter += unitAfter;
          } else if (boss.cycle === 'weekly') {
            weeklyBeforeList.push(unitBefore);
            weeklyAfterList.push(unitAfter);
          }
        });

        weeklyBeforeList.sort((a, b) => b - a);
        weeklyAfterList.sort((a, b) => b - a);

        const cWeeklyBefore = weeklyBeforeList.slice(0, 12).reduce((sum, p) => sum + p, 0);
        const cWeeklyAfter = weeklyAfterList.slice(0, 12).reduce((sum, p) => sum + p, 0);

        return {
          weeklyBefore: cWeeklyBefore,
          weeklyAfter: cWeeklyAfter,
          weeklyDiff: cWeeklyAfter - cWeeklyBefore,
          monthlyBefore: (cWeeklyBefore * 4) + monthlyBefore,
          monthlyAfter: (cWeeklyAfter * 4) + monthlyAfter,
          weeklyCount: weeklyBeforeList.length
        };
      };

      const currentCalc = incomePeriod === 'weekly' ? calculation.weekly : calculation.monthly;

      const activeChar = characters.find(c => c.id === activeCharId);
      const activeCharSummary = activeChar ? getCharacterSummary(activeChar) : null;
      const activeCharWeeklyCount = activeCharSummary ? activeCharSummary.weeklyCount : 0;
      const activeCharMonthlyCount = Object.keys(activeChar?.clears || {}).filter(bId => bossMap[bId]?.cycle === 'monthly').length;

      const currentInputPrice = parseInt(dropItemPriceRaw.replace(/[^0-9]/g, '') || '0', 10);
      const previewMyShare = currentInputPrice > 0 
        ? Math.floor((currentInputPrice * ((100 - dropTaxRate) / 100)) / dropPartyCount) 
        : 0;

      const { weeklyMultiBosses, weeklySingleBosses, monthlyBosses } = useMemo(() => {
        const diffOrder = { '이지': 1, '노말': 2, '하드': 3, '카오스': 4, '익스트림': 5 };
        const groupByCycleStrictOrder = (targetCycle) => {
          const map = new Map();
          bossList
            .filter(b => b.cycle === targetCycle)
            .forEach(b => {
              if (!map.has(b.name)) {
                map.set(b.name, { name: b.name, cycle: b.cycle, variants: [] });
              }
              map.get(b.name).variants.push(b);
            });
          const list = Array.from(map.values());
          list.forEach(boss => {
            boss.variants.sort((a, b) => (diffOrder[a.difficulty] || 9) - (diffOrder[b.difficulty] || 9));
          });
          return list;
        };
        const weeklyList = groupByCycleStrictOrder('weekly');
        const monthlyList = groupByCycleStrictOrder('monthly');
        return {
          weeklyMultiBosses: weeklyList.filter(b => b.variants.length > 1),
          weeklySingleBosses: weeklyList.filter(b => b.variants.length === 1),
          monthlyBosses: monthlyList
        };
      }, [bossList]);

      const themeContainer = isDark ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900';
      const themeCard = isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm';
      const themeInnerInput = isDark ? 'bg-slate-950 border-slate-800 text-white placeholder-slate-500' : 'bg-slate-100 border-slate-300 text-slate-900 placeholder-slate-400';
      const themeInnerBox = isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-200';

      const getBadgeColor = (diff, isSelected) => {
        if (isSelected) {
          if (diff === '익스트림') return 'bg-purple-600 text-white border-purple-500 font-bold shadow';
          if (diff === '하드') return 'bg-rose-600 text-white border-rose-500 font-bold shadow';
          if (diff === '카오스') return 'bg-amber-600 text-white border-amber-500 font-bold shadow';
          if (diff === '노말') return 'bg-sky-600 text-white border-sky-500 font-bold shadow';
          return 'bg-emerald-600 text-white border-emerald-500 font-bold';
        } else {
          if (isDark) {
            if (diff === '익스트림') return 'bg-purple-950/40 text-purple-400 border-purple-900/50 hover:bg-purple-900/40';
            if (diff === '하드') return 'bg-rose-950/40 text-rose-400 border-rose-900/50 hover:bg-rose-900/40';
            if (diff === '카오스') return 'bg-amber-950/40 text-amber-400 border-amber-900/50 hover:bg-amber-900/40';
            if (diff === '노말') return 'bg-sky-950/40 text-sky-400 border-sky-900/50 hover:bg-sky-900/40';
            return 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800';
          } else {
            if (diff === '익스트림') return 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100';
            if (diff === '하드') return 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100';
            if (diff === '카오스') return 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100';
            if (diff === '노말') return 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100';
            return 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
          }
        }
      };

      const renderBossRow = (bossGroup) => {
        const variantIds = bossGroup.variants.map(v => v.id);
        const isSingle = bossGroup.variants.length === 1;
        const singleVariant = isSingle ? bossGroup.variants[0] : null;

        const selectedVariant = bossGroup.variants.find(v => Boolean(activeChar?.clears?.[v.id]));
        const isAnySelected = Boolean(selectedVariant);
        const partySize = selectedVariant ? (activeChar?.clears?.[selectedVariant.id] || 1) : 1;
        const unitBefore = selectedVariant ? Math.floor(selectedVariant.priceBefore / partySize) : 0;
        const unitAfter = selectedVariant ? Math.floor(selectedVariant.priceAfter / partySize) : 0;

        if (isSingle) {
          return (
            <div
              key={bossGroup.name}
              onClick={() => activeChar && selectBossDifficulty(singleVariant, variantIds)}
              className={`px-3.5 py-2.5 rounded-2xl border transition-all flex items-center justify-between select-none ${
                activeChar ? 'cursor-pointer' : 'cursor-not-allowed'
              } ${
                isAnySelected
                  ? (isDark ? 'bg-slate-900 border-sky-500/80 shadow-md' : 'bg-sky-50/70 border-sky-400 shadow-sm')
                  : (isDark ? 'bg-slate-900/50 border-slate-800/80 hover:bg-slate-900/70' : 'bg-white border-slate-200 hover:bg-slate-50')
              }`}
            >
              <div className="flex items-center gap-3">
                <BossImage name={bossGroup.name} isDark={isDark} />
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className={`text-[10px] px-1.5 py-0.5 rounded-lg border font-bold ${getBadgeColor(singleVariant.difficulty, isAnySelected)}`}>
                      {singleVariant.difficulty}
                    </span>
                    <span className={`text-sm font-extrabold ${isAnySelected ? (isDark ? 'text-white' : 'text-sky-950') : (isDark ? 'text-slate-200' : 'text-slate-800')}`}>
                      {bossGroup.name}
                    </span>
                  </div>
                  <div className={`text-xs mt-0.5 flex items-center gap-2 ${isAnySelected ? 'text-sky-500 font-bold' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>
                    <span>전: {formatMeso(unitBefore || singleVariant.priceBefore)}</span>
                    <span className="opacity-40">|</span>
                    <span className="text-amber-400">후: {formatMeso(unitAfter || singleVariant.priceAfter)}</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {isAnySelected && (
                  <div onClick={e => e.stopPropagation()} className={`flex items-center gap-1.5 px-2 py-1 rounded-xl border ${themeInnerBox}`}>
                    <button type="button" onClick={() => setBossPartySize(singleVariant.id, partySize - 1)} className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${isDark ? 'bg-slate-800 text-white' : 'bg-white text-slate-700 border border-slate-300'}`}>-</button>
                    <span className="text-xs px-1 text-sky-500 font-bold whitespace-nowrap">{partySize}인</span>
                    <button type="button" onClick={() => setBossPartySize(singleVariant.id, partySize + 1)} className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${isDark ? 'bg-slate-800 text-white' : 'bg-white text-slate-700 border border-slate-300'}`}>+</button>
                  </div>
                )}
                <div className={`w-5 h-5 rounded-lg flex items-center justify-center text-xs font-black ${isAnySelected ? 'bg-sky-500 text-slate-950 shadow-sm' : (isDark ? 'border border-slate-700' : 'border border-slate-300')}`}>
                  {isAnySelected && '✓'}
                </div>
              </div>
            </div>
          );
        }

        return (
          <div key={bossGroup.name} className={`px-3.5 py-2.5 rounded-2xl border transition-all flex items-center justify-between gap-3 ${isAnySelected ? (isDark ? 'bg-slate-900 border-sky-500/80 shadow-md' : 'bg-sky-50/70 border-sky-400 shadow-sm') : (isDark ? 'bg-slate-900/50 border-slate-800/80' : 'bg-white border-slate-200')}`}>
            <div className="flex items-center gap-3 min-w-[120px]">
              <BossImage name={bossGroup.name} isDark={isDark} />
              <div>
                <div className={`text-sm font-extrabold leading-snug ${isAnySelected ? (isDark ? 'text-white' : 'text-sky-950') : (isDark ? 'text-slate-200' : 'text-slate-800')}`}>
                  {bossGroup.name}
                </div>
                {isAnySelected ? (
                  <div className="text-[11px] font-bold mt-0.5 flex items-center gap-1.5 whitespace-nowrap">
                    <span className="text-sky-400">전:{formatMeso(unitBefore)}</span>
                    <span className="text-amber-400">후:{formatMeso(unitAfter)}</span>
                  </div>
                ) : (
                  <div className={`text-[10px] mt-0.5 ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>선택안됨</div>
                )}
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap justify-end flex-1">
              {bossGroup.variants.map(v => {
                const isSelected = activeChar?.clears?.[v.id];
                return (
                  <button
                    key={v.id}
                    type="button"
                    disabled={!activeChar}
                    onClick={() => selectBossDifficulty(v, variantIds)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all active:scale-95 whitespace-nowrap ${getBadgeColor(v.difficulty, isSelected)} ${!activeChar ? 'opacity-50 cursor-not-allowed' : ''}`}
                  >
                    {v.difficulty}
                  </button>
                );
              })}

              {isAnySelected && (
                <div className={`flex items-center gap-1.5 px-2 py-1 rounded-xl border ml-1 ${themeInnerBox}`}>
                  <button type="button" onClick={() => setBossPartySize(selectedVariant.id, partySize - 1)} className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${isDark ? 'bg-slate-800 text-white' : 'bg-white text-slate-700 border border-slate-300'}`}>-</button>
                  <span className="text-xs px-1 text-sky-500 font-bold whitespace-nowrap">{partySize}인</span>
                  <button type="button" onClick={() => setBossPartySize(selectedVariant.id, partySize + 1)} className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold active:scale-95 ${isDark ? 'bg-slate-800 text-white' : 'bg-white text-slate-700 border border-slate-300'}`}>+</button>
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className={`min-h-screen pb-24 font-sans transition-colors duration-200 ${themeContainer}`}>
          <div className="max-w-7xl mx-auto px-4 py-6">
            
            {/* 상단 통합 헤더 */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-800/40">
              <div className="flex items-center justify-between sm:justify-start gap-3">
                <h1 className={`text-lg sm:text-xl font-extrabold tracking-tight ${isDark ? 'text-slate-100' : 'text-slate-900'}`}>
                  메이플 보스 수익 계산기
                </h1>
                <span className={`text-[10px] sm:text-[11px] px-2 py-0.5 rounded-full border font-semibold shrink-0 ${
                  syncStatus.includes('클라우드 연동됨') ? 'bg-emerald-950/50 text-emerald-400 border-emerald-800/60' :
                  syncStatus === '저장 중...' || syncStatus === '불러오는 중...' ? 'bg-sky-950/50 text-sky-400 border-sky-800/60' :
                  'bg-slate-900 text-slate-400 border-slate-800'
                }`}>
                  {syncStatus}
                </span>
              </div>

              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                <button type="button" onClick={toggleTheme} className={`text-xs px-2.5 py-1.5 border rounded-xl transition-all flex items-center gap-1 font-semibold shrink-0 whitespace-nowrap ${isDark ? 'bg-slate-800 border-slate-700 text-amber-300' : 'bg-white border-slate-300 text-indigo-600 shadow-sm'}`}>
                  <span>{isDark ? '🌙 다크' : '☀️ 라이트'}</span>
                </button>
                <button onClick={() => { setTempSyncId(syncId || ''); setTempSyncPassword(''); setSyncMode(syncId ? 'login' : 'register'); setShowSyncModal(true); }} className={`text-xs px-2.5 py-1.5 border rounded-xl font-semibold transition-colors shrink-0 whitespace-nowrap ${isDark ? (syncId ? 'bg-slate-800 border-slate-700 text-emerald-400' : 'bg-sky-950/60 border-sky-800/80 text-sky-300') : (syncId ? 'bg-white border-slate-300 text-emerald-700' : 'bg-sky-50 border-sky-300 text-sky-800')}`}>
                  {syncId ? `☁️ 연동됨 (${syncId})` : '☁️ 계정 연동'}
                </button>
                <button type="button" onClick={handleResetAllData} className={`text-xs px-2.5 py-1.5 border rounded-xl font-semibold transition-colors shrink-0 whitespace-nowrap ${isDark ? 'bg-rose-950/60 border-rose-900/80 text-rose-400' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                  초기화
                </button>
              </div>
            </div>

            {/* 메인 레이아웃 */}
            <div className="space-y-6">
              
              {/* 패치 전후 비교 대시보드 */}
              <div className={`border rounded-2xl p-5 shadow-lg sticky top-2 z-20 backdrop-blur-md transition-colors ${isDark ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200 shadow-md'}`}>
                <div className="flex items-center justify-between mb-3">
                  <div className="text-[11px] font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span>⚡ 결정석 패치 전후 총 수익 비교 ({incomePeriod === 'weekly' ? '주간' : '월간'})</span>
                  </div>
                  <div className={`flex items-center p-0.5 rounded-lg border text-[10px] font-bold shrink-0 ${themeInnerBox}`}>
                    <button type="button" onClick={() => setIncomePeriod('weekly')} className={`px-2.5 py-0.5 rounded-md transition-all ${incomePeriod === 'weekly' ? 'bg-amber-600 text-white shadow' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>주간</button>
                    <button type="button" onClick={() => setIncomePeriod('monthly')} className={`px-2.5 py-0.5 rounded-md transition-all ${incomePeriod === 'monthly' ? 'bg-amber-600 text-white shadow' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>월간</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div className={`p-3.5 rounded-xl border ${isDark ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <div className="text-[11px] font-semibold text-sky-400 mb-1">패치 전 총 수익</div>
                    <div className={`text-lg font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>{formatMeso(currentCalc.before)}</div>
                  </div>

                  <div className={`p-3.5 rounded-xl border ${isDark ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <div className="text-[11px] font-semibold text-amber-400 mb-1">패치 후 총 수익</div>
                    <div className={`text-lg font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>{formatMeso(currentCalc.after)}</div>
                  </div>

                  <div className={`p-3.5 rounded-xl border flex flex-col justify-between ${
                    currentCalc.diff < 0 
                      ? (isDark ? 'bg-rose-950/30 border-rose-900/50' : 'bg-rose-50 border-rose-200') 
                      : (isDark ? 'bg-emerald-950/30 border-emerald-900/50' : 'bg-emerald-50 border-emerald-200')
                  }`}>
                    <div className="text-[11px] font-semibold opacity-80 flex items-center justify-between">
                      <span>패치 변동액</span>
                      <span className={`text-[10px] px-1.5 py-0.5 rounded font-black ${currentCalc.diff < 0 ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                        {currentCalc.percent}%
                      </span>
                    </div>
                    <div className="flex items-center gap-1 mt-1">
                      <span className={`text-base font-black ${currentCalc.diff < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {formatMeso(currentCalc.diff)}
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              {/* 2단 배치 */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                {/* 보유 캐릭터 목록 */}
                <div className="lg:col-span-4 space-y-4">
                  <div className={`border rounded-2xl p-4 transition-colors ${themeCard}`}>
                    <div className="text-xs font-extrabold mb-3 flex items-center justify-between">
                      <span className={isDark ? 'text-slate-300' : 'text-slate-700'}>보유 캐릭터 목록 ({characters.length})</span>
                      <button type="button" onClick={() => { setAddMode('api'); setFormError(''); setShowAddCharModal(true); }} className="text-xs px-2.5 py-1 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold transition-all shadow-sm whitespace-nowrap">
                        + 캐릭터 추가
                      </button>
                    </div>

                    {characters.length === 0 ? (
                      <div className={`text-center py-6 text-xs border border-dashed rounded-xl ${isDark ? 'text-slate-500 border-slate-800' : 'text-slate-400 border-slate-300'}`}>등록된 캐릭터가 없습니다.</div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2.5 max-h-[500px] overflow-y-auto pr-1 no-scrollbar">
                        {characters.map(c => {
                          const summary = getCharacterSummary(c);
                          const isSelected = activeCharId === c.id;
                          const charBefore = incomePeriod === 'weekly' ? summary.weeklyBefore : summary.monthlyBefore;
                          const charAfter = incomePeriod === 'weekly' ? summary.weeklyAfter : summary.monthlyAfter;
                          const charDiff = charAfter - charBefore;

                          return (
                            <div key={c.id} onClick={() => setActiveCharId(c.id)} className={`w-full p-3 rounded-xl transition-all border cursor-pointer relative flex flex-col justify-between gap-2 ${isSelected ? (isDark ? 'bg-sky-950/80 border-sky-500 text-white shadow-sm' : 'bg-sky-50 border-sky-500 text-sky-900 shadow-sm font-bold') : (isDark ? 'bg-slate-900/50 border-slate-800 text-slate-400 hover:bg-slate-800/60' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100')}`}>
                              <div className="flex items-center gap-2.5 truncate w-full pr-6">
                                {c.image ? (
                                  <img src={c.image} alt="" className="w-9 h-9 rounded-full bg-slate-800 object-cover shrink-0" />
                                ) : (
                                  <div className="w-9 h-9 rounded-full bg-sky-600 border border-sky-400 flex items-center justify-center text-xs text-white font-bold shrink-0">{c.name.slice(0, 1)}</div>
                                )}
                                <div className="truncate">
                                  <div className="font-bold text-xs sm:text-sm truncate">{c.name}</div>
                                  <div className="text-[10px] opacity-70">Lv.{c.level}</div>
                                </div>
                              </div>

                              <div className="w-full flex items-center justify-between pt-2 border-t border-slate-800/10 text-xs">
                                <div>
                                  <span className="text-[10px] text-sky-400">전:{formatMeso(charBefore)}</span>
                                  <span className="text-[10px] text-amber-400 ml-1.5">후:{formatMeso(charAfter)}</span>
                                </div>
                                <DiffBadge diff={charDiff} />
                              </div>

                              <button type="button" onClick={(e) => { e.stopPropagation(); deleteCharacter(c.id); }} className="absolute top-2.5 right-2.5 text-rose-400 hover:text-rose-300 p-1 rounded-md" title="캐릭터 삭제">✕</button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                {/* 보스 체크리스트 및 득템 정산 */}
                <div className="lg:col-span-8 space-y-4">
                  {activeChar && (
                    <div className={`border rounded-2xl p-4 transition-colors ${themeCard}`}>
                      <div className="flex items-center justify-between mb-3 text-xs">
                        <div>
                          {mainTab === 'weekly' && (
                            <span className={isDark ? 'text-slate-300' : 'text-slate-600'}>
                              [{activeChar.name}] 주간 보스 클리어: <strong className={activeCharWeeklyCount > 12 ? 'text-rose-500 font-black' : 'text-sky-500 font-bold'}>{activeCharWeeklyCount}</strong> / 12개
                            </span>
                          )}
                          {mainTab === 'monthly' && (
                            <span className={isDark ? 'text-slate-300' : 'text-slate-600'}>
                              [{activeChar.name}] 월간 보스 클리어: <strong className="text-purple-400 font-bold">{activeCharMonthlyCount}</strong>개
                            </span>
                          )}
                          {mainTab === 'drop' && (
                            <span className={isDark ? 'text-slate-300' : 'text-slate-600'}>
                              전체 등록된 득템: <strong className="text-amber-500 font-bold">{allDrops.length}</strong>개
                            </span>
                          )}
                        </div>
                      </div>

                      <div className={`grid grid-cols-3 gap-1 p-1 rounded-xl border mb-2 shadow-sm ${themeInnerBox}`}>
                        <button type="button" onClick={() => setMainTab('weekly')} className={`py-2 text-xs font-bold rounded-lg transition-all ${mainTab === 'weekly' ? 'bg-sky-600 text-white shadow' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>주간 보스</button>
                        <button type="button" onClick={() => setMainTab('monthly')} className={`py-2 text-xs font-bold rounded-lg transition-all ${mainTab === 'monthly' ? 'bg-purple-600 text-white shadow' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>월간 보스</button>
                        <button type="button" onClick={() => setMainTab('drop')} className={`py-2 text-xs font-bold rounded-lg transition-all ${mainTab === 'drop' ? 'bg-amber-600 text-white shadow' : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>득템 정산</button>
                      </div>
                    </div>
                  )}

                  {characters.length === 0 ? (
                    <div className={`border rounded-2xl p-10 text-center text-xs ${isDark ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-white border-slate-200 text-slate-500'}`}>등록된 캐릭터가 없습니다.</div>
                  ) : !activeChar ? (
                    <div className={`border rounded-2xl p-10 text-center text-xs ${isDark ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-white border-slate-200 text-slate-500'}`}>목록에서 캐릭터를 선택해주세요.</div>
                  ) : (
                    <div>
                      {mainTab === 'weekly' && (
                        <div>
                          {loadingBosses ? (
                            <div className="text-center py-10 text-sm text-slate-500">bosses.csv 로드 중...</div>
                          ) : loadError ? (
                            <div className="p-4 bg-rose-950/40 border border-rose-900 rounded-xl text-center text-xs text-rose-400">bosses.csv 로드 실패</div>
                          ) : (
                            <div className="space-y-4">
                              {weeklyMultiBosses.length > 0 && (
                                <div className="space-y-2">
                                  <div className="text-xs font-extrabold text-sky-400 px-1">⚔️ 난이도 선택 보스</div>
                                  {weeklyMultiBosses.map(renderBossRow)}
                                </div>
                              )}
                              {weeklySingleBosses.length > 0 && (
                                <div>
                                  <div className="text-xs font-extrabold text-slate-400 px-1 mb-2">🛡️ 단일 난이도 보스</div>
                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">{weeklySingleBosses.map(renderBossRow)}</div>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      )}

                      {mainTab === 'monthly' && (
                        <div className="space-y-3">
                          <div className="p-3 bg-purple-950/20 border border-purple-800/30 rounded-2xl text-xs text-purple-300">💡 월간 보스 패치 전후 비교 뷰</div>
                          {monthlyBosses.map(renderBossRow)}
                        </div>
                      )}

                      {mainTab === 'drop' && (
                        <div className={`border rounded-2xl p-5 ${isDark ? 'bg-slate-900 border-amber-500/30' : 'bg-white border-amber-400/40'}`}>
                          <div className="text-sm font-bold text-amber-500 mb-3">✨ 보스 득템 분배 계산기</div>
                          <form onSubmit={handleAddDrop} className="space-y-3">
                            <input type="text" placeholder="아이템 이름" value={dropItemName} onChange={e => setDropItemName(e.target.value)} className={`border rounded-xl px-3 py-2 text-xs w-full ${themeInnerInput}`} />
                            <input type="text" placeholder="판매 금액" value={dropItemPriceRaw} onChange={e => setDropItemPriceRaw(e.target.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ','))} className={`border rounded-xl px-3 py-2 text-xs w-full font-mono ${themeInnerInput}`} />
                            <button type="submit" className="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg font-bold text-white text-xs w-full">득템 등록</button>
                          </form>
                        </div>
                      )}
                    </div>
                  )}
                </div>

              </div>
            </div>

            {/* 푸터 */}
            <div className="mt-10 pt-4 border-t border-slate-800/60 text-center text-[11px] text-slate-500">
              <a href="https://github.com/Global-YDH/Maple-Calculator" target="_blank" rel="noopener noreferrer" className="text-sky-500 font-medium">💻 GitHub Repository</a>
            </div>

            {/* 캐릭터 추가 모달 (수동 추가 탭 및 UI 복원 완료) */}
            {showAddCharModal && (
              <div onClick={() => setShowAddCharModal(false)} className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                <div onClick={e => e.stopPropagation()} className={`border rounded-2xl p-5 max-w-sm w-full shadow-2xl relative ${themeCard}`}>
                  <button type="button" onClick={() => setShowAddCharModal(false)} className="absolute top-4 right-4 text-xs">✕</button>
                  <h3 className={`text-sm font-bold mb-3 pr-6 ${isDark ? 'text-white' : 'text-slate-900'}`}>캐릭터 추가</h3>

                  <div className="flex gap-2 mb-3">
                    <button
                      type="button"
                      onClick={() => { setAddMode('api'); setFormError(''); }}
                      className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                        addMode === 'api' ? 'bg-sky-600 text-white shadow' : (isDark ? 'bg-slate-800/70 text-slate-400' : 'bg-slate-200/80 text-slate-600')
                      }`}
                    >
                      API 자동 조회
                    </button>
                    <button
                      type="button"
                      onClick={() => { setAddMode('manual'); setFormError(''); }}
                      className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                        addMode === 'manual' ? 'bg-sky-600 text-white shadow' : (isDark ? 'bg-slate-800/70 text-slate-400' : 'bg-slate-200/80 text-slate-600')
                      }`}
                    >
                      수동 직접 입력
                    </button>
                  </div>

                  {addMode === 'api' ? (
                    <form onSubmit={handleApiAdd}>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="캐릭터 닉네임 입력"
                          value={searchName}
                          onChange={e => setSearchName(e.target.value)}
                          disabled={isSearching}
                          className={`border rounded-xl px-3.5 py-2 text-xs flex-1 focus:outline-none focus:border-sky-500 ${themeInnerInput}`}
                        />
                        <button
                          type="submit"
                          disabled={isSearching}
                          className="bg-sky-600 hover:bg-sky-500 disabled:bg-slate-400 px-4 py-2 rounded-xl text-xs font-bold text-white transition-colors whitespace-nowrap"
                        >
                          {isSearching ? '조회중...' : '추가'}
                        </button>
                      </div>
                    </form>
                  ) : (
                    <form onSubmit={handleManualAdd} className="space-y-2">
                      <div className="grid grid-cols-12 gap-2">
                        <input
                          type="text"
                          placeholder="닉네임"
                          value={manualName}
                          onChange={e => setManualName(e.target.value)}
                          className={`col-span-5 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500 ${themeInnerInput}`}
                        />
                        <input
                          type="text"
                          placeholder="직업"
                          value={manualJob}
                          onChange={e => setManualJob(e.target.value)}
                          className={`col-span-4 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500 ${themeInnerInput}`}
                        />
                        <input
                          type="number"
                          placeholder="레벨"
                          value={manualLevel}
                          onChange={e => setManualLevel(e.target.value)}
                          className={`col-span-3 border rounded-xl px-2 py-2 text-xs focus:outline-none focus:border-sky-500 text-center ${themeInnerInput}`}
                        />
                      </div>
                      <button
                        type="submit"
                        className={`w-full py-2 rounded-xl text-xs font-bold border transition-colors ${
                          isDark ? 'bg-slate-800 hover:bg-slate-700 text-sky-400 border-slate-700' : 'bg-slate-100 hover:bg-slate-200 text-sky-600 border-slate-300'
                        }`}
                      >
                        캐릭터 추가 완료
                      </button>
                    </form>
                  )}

                  {formError && <p className="text-[11px] text-rose-500 mt-2 px-1">{formError}</p>}
                </div>
              </div>
            )}

            {/* 계정 연동 모달 */}
            {showSyncModal && (
              <div onClick={() => setShowSyncModal(false)} className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                <div onClick={e => e.stopPropagation()} className={`border rounded-2xl p-5 max-w-sm w-full shadow-2xl relative ${themeCard}`}>
                  <button type="button" onClick={() => setShowSyncModal(false)} className="absolute top-4 right-4 text-xs">✕</button>
                  <h3 className="text-sm font-bold mb-3">클라우드 계정 연동</h3>
                  <input type="text" placeholder="동기화 ID" value={tempSyncId} onChange={e => setTempSyncId(e.target.value)} className={`border rounded-xl px-3 py-2 text-xs w-full mb-2 ${themeInnerInput}`} />
                  <input type="password" placeholder="비밀번호" value={tempSyncPassword} onChange={e => setTempSyncPassword(e.target.value)} className={`border rounded-xl px-3 py-2 text-xs w-full mb-3 ${themeInnerInput}`} />
                  <button type="button" onClick={handleSyncSubmit} className="w-full bg-sky-600 text-white rounded-xl py-2 text-xs font-bold">확인</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
